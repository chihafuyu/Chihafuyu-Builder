name: 🧹 Automated Release Janitor

on:
  schedule:
    - cron: '15 5,17 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Purge All Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "[INFO] Starting Total Release Janitor..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' | while read -r TAG_NAME; do
            if [[ -n "$TAG_NAME" ]]; then
              echo "[INFO] Initiating deletion for release and tag: $TAG_NAME"
              gh release delete "$TAG_NAME" --yes --cleanup-tag || true
            fi
          done

      - name: Purge All Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "[INFO] Starting Total Workflow Run Janitor..."
          
          RUN_IDS=$(gh run list --limit 1000 --json databaseId -q '.[].databaseId')

          if [[ -z "$RUN_IDS" ]]; then
            echo "[INFO] No extra workflow runs to delete. The dashboard is clean!"
          else
            for RUN_ID in $RUN_IDS; do
              if [[ "$RUN_ID" == "${{ github.run_id }}" ]]; then
                echo "[SKIP] Run ID $RUN_ID is the currently active Janitor job."
                continue
              fi

              echo "[INFO] Deleting workflow run: $RUN_ID"
              gh run delete "$RUN_ID" || true
            done
            echo "[INFO] Workflow run cleanup complete!"
          fi
