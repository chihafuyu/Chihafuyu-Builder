---
name: 🧹 Automated Release Janitor

"on":
  schedule:
    - cron: '48 9 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: janitor
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Purge Releases and Paired Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[INFO] Deleting ALL releases."
          gh release list --limit 1000 --json tagName \
            -q '.[].tagName' | while read -r TAG_NAME; do
            if [[ -n "$TAG_NAME" ]]; then
              echo "[INFO] Deleting release: $TAG_NAME"
              gh release delete "$TAG_NAME" --yes --cleanup-tag || true
            fi
          done

      - name: Purge Orphan Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[INFO] Deleting ALL remaining tags."
          git ls-remote --tags origin \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | while read -r TAG; do
            if [[ -z "$TAG" || "$TAG" == *"^{}" ]]; then
              continue
            fi
            echo "[INFO] Deleting tag: $TAG"
            git push origin --delete "$TAG" || true
          done

      - name: Purge Workflow Runs (Except Janitor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[INFO] Scanning for completed runs to delete..."

          for wf in .github/workflows/*.yml; do
            wf_name=$(basename "$wf")

            if [[ "$wf_name" == "janitor.yml" ]]; then
              echo "[INFO] Skipping self-deletion for: $wf_name"
              continue
            fi

            echo "[INFO] Processing workflow: $wf_name"

            gh run list --workflow "$wf_name" --limit 1000 --status completed \
              --json databaseId -q '.[].databaseId' | while read -r RUN_ID; do
              if [[ -n "$RUN_ID" ]]; then
                echo "[INFO] Deleting run $RUN_ID from $wf_name"
                gh run delete "$RUN_ID" || true
              fi
            done
          done
