---
name: 🖨️ Aidan Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_adobe_scan:
        description: 'Patch adobe-scan'
        required: true
        type: boolean
        default: true
      app_sidelineswap:
        description: 'Patch sidelineswap'
        required: true
        type: boolean
        default: true
      app_aftership:
        description: 'Patch aftership'
        required: true
        type: boolean
        default: true
      app_blackjack:
        description: 'Patch blackjack'
        required: true
        type: boolean
        default: true
      app_sezzle:
        description: 'Patch sezzle'
        required: true
        type: boolean
        default: true
      app_365_pay:
        description: 'Patch 365-pay'
        required: true
        type: boolean
        default: true
      app_fizz:
        description: 'Patch fizz'
        required: true
        type: boolean
        default: true
      app_geocaching:
        description: 'Patch geocaching'
        required: true
        type: boolean
        default: true
      app_nhl:
        description: 'Patch nhl'
        required: true
        type: boolean
        default: true
      app_canvas_student:
        description: 'Patch canvas-student'
        required: true
        type: boolean
        default: true
      app_navigate360_student:
        description: 'Patch navigate360-student'
        required: true
        type: boolean
        default: true
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom]
      custom_cli_version:
        description: 'Custom CLI Version (e.g. v1.16.0)'
        required: false
        default: ''
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_ADOBE_SCAN: ${{ inputs.app_adobe_scan }}
      APP_SIDELINESWAP: ${{ inputs.app_sidelineswap }}
      APP_AFTERSHIP: ${{ inputs.app_aftership }}
      APP_BLACKJACK: ${{ inputs.app_blackjack }}
      APP_SEZZLE: ${{ inputs.app_sezzle }}
      APP_365_PAY: ${{ inputs.app_365_pay }}
      APP_FIZZ: ${{ inputs.app_fizz }}
      APP_GEOCACHING: ${{ inputs.app_geocaching }}
      APP_NHL: ${{ inputs.app_nhl }}
      APP_CANVAS_STUDENT: ${{ inputs.app_canvas_student }}
      APP_NAVIGATE360_STUDENT: ${{ inputs.app_navigate360_student }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_ADOBE_SCAN" == "true" ]]; then
            LIST="$LIST,adobe-scan"
          fi
          if [[ "$APP_SIDELINESWAP" == "true" ]]; then
            LIST="$LIST,sidelineswap"
          fi
          if [[ "$APP_AFTERSHIP" == "true" ]]; then
            LIST="$LIST,aftership"
          fi
          if [[ "$APP_BLACKJACK" == "true" ]]; then
            LIST="$LIST,blackjack"
          fi
          if [[ "$APP_SEZZLE" == "true" ]]; then
            LIST="$LIST,sezzle"
          fi
          if [[ "$APP_365_PAY" == "true" ]]; then
            LIST="$LIST,365-pay"
          fi
          if [[ "$APP_FIZZ" == "true" ]]; then
            LIST="$LIST,fizz"
          fi
          if [[ "$APP_GEOCACHING" == "true" ]]; then
            LIST="$LIST,geocaching"
          fi
          if [[ "$APP_NHL" == "true" ]]; then
            LIST="$LIST,nhl"
          fi
          if [[ "$APP_CANVAS_STUDENT" == "true" ]]; then
            LIST="$LIST,canvas-student"
          fi
          if [[ "$APP_NAVIGATE360_STUDENT" == "true" ]]; then
            LIST="$LIST,navigate360-student"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      HA_API_KEY: ${{ secrets.HA_API_KEY }}
      MD_API_KEY: ${{ secrets.MD_API_KEY }}
      PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
      PLAY_AAS_TOKEN: ${{ secrets.PLAY_AAS_TOKEN }}
      DEVICE_PROPERTIES_B64: ${{ secrets.DEVICE_PROPERTIES_B64 }}
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      SESSION_STRING: ${{ secrets.SESSION_STRING }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    with:
      ecosystem: "aidan"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "ihatenodejs/aidans-patches"
      custom_patch_filename: "aidan-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "aidan"
