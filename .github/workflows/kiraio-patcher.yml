name: 🌸 Kiraio-moe Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_atomic:
        description: 'Patch atomic'
        required: true
        type: boolean
        default: false
      app_pixiv:
        description: 'Patch pixiv'
        required: true
        type: boolean
        default: false
      app_boorusama:
        description: 'Patch boorusama'
        required: true
        type: boolean
        default: false
      app_epic:
        description: 'Patch epic'
        required: true
        type: boolean
        default: false
      app_fakegps:
        description: 'Patch fakegps'
        required: true
        type: boolean
        default: false
      app_hermit:
        description: 'Patch hermit'
        required: true
        type: boolean
        default: false
      app_hidden_settings:
        description: 'Patch hidden-settings'
        required: true
        type: boolean
        default: false
      app_ilovepdf:
        description: 'Patch ilovepdf'
        required: true
        type: boolean
        default: false
      app_key_mapper:
        description: 'Patch key-mapper'
        required: true
        type: boolean
        default: false
      app_keymate:
        description: 'Patch keymate'
        required: true
        type: boolean
        default: false
      app_manga_plus:
        description: 'Patch manga-plus'
        required: true
        type: boolean
        default: false
      app_pixellab:
        description: 'Patch pixellab'
        required: true
        type: boolean
        default: false
      app_timestamp_camera:
        description: 'Patch timestamp-camera'
        required: true
        type: boolean
        default: false
      app_nekopoi:
        description: 'Patch nekopoi'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options: [default, google_play, huggingface, archive, apkmirror, apkpure, apkcombo, aptoide, uptodown]
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_ATOMIC: ${{ inputs.app_atomic }}
      APP_PIXIV: ${{ inputs.app_pixiv }}
      APP_BOORUSAMA: ${{ inputs.app_boorusama }}
      APP_EPIC: ${{ inputs.app_epic }}
      APP_FAKEGPS: ${{ inputs.app_fakegps }}
      APP_HERMIT: ${{ inputs.app_hermit }}
      APP_HIDDEN_SETTINGS: ${{ inputs.app_hidden_settings }}
      APP_ILOVEPDF: ${{ inputs.app_ilovepdf }}
      APP_KEY_MAPPER: ${{ inputs.app_key_mapper }}
      APP_KEYMATE: ${{ inputs.app_keymate }}
      APP_MANGA_PLUS: ${{ inputs.app_manga_plus }}
      APP_PIXELLAB: ${{ inputs.app_pixellab }}
      APP_TIMESTAMP_CAMERA: ${{ inputs.app_timestamp_camera }}
      APP_NEKOPOI: ${{ inputs.app_nekopoi }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_ATOMIC" == "true" ]]; then LIST="$LIST,atomic"; fi
          if [[ "$APP_PIXIV" == "true" ]]; then LIST="$LIST,pixiv"; fi
          if [[ "$APP_BOORUSAMA" == "true" ]]; then LIST="$LIST,boorusama"; fi
          if [[ "$APP_EPIC" == "true" ]]; then LIST="$LIST,epic"; fi
          if [[ "$APP_FAKEGPS" == "true" ]]; then LIST="$LIST,fakegps"; fi
          if [[ "$APP_HERMIT" == "true" ]]; then LIST="$LIST,hermit"; fi
          if [[ "$APP_HIDDEN_SETTINGS" == "true" ]]; then LIST="$LIST,hidden-settings"; fi
          if [[ "$APP_ILOVEPDF" == "true" ]]; then LIST="$LIST,ilovepdf"; fi
          if [[ "$APP_KEY_MAPPER" == "true" ]]; then LIST="$LIST,key-mapper"; fi
          if [[ "$APP_KEYMATE" == "true" ]]; then LIST="$LIST,keymate"; fi
          if [[ "$APP_MANGA_PLUS" == "true" ]]; then LIST="$LIST,manga-plus"; fi
          if [[ "$APP_PIXELLAB" == "true" ]]; then LIST="$LIST,pixellab"; fi
          if [[ "$APP_TIMESTAMP_CAMERA" == "true" ]]; then LIST="$LIST,timestamp-camera"; fi
          if [[ "$APP_NEKOPOI" == "true" ]]; then LIST="$LIST,nekopoi"; fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then echo "::error::No applications selected!"; exit 1; fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "kiraio-moe"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "kiraio-moe/Lain-Patches"
      custom_patch_filename: "kiraio-moe-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "kiraio-moe"
