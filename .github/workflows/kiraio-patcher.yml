name: 🌸 Kiraio-moe Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_atomic:
        description: 'Patch atomic'
        required: true
        type: boolean
        default: false
      app_audiorelay:
        description: 'Patch audiorelay'
        required: true
        type: boolean
        default: false
      app_boorusama:
        description: 'Patch boorusama'
        required: true
        type: boolean
        default: false
      app_epic:
        description: 'Patch epic'
        required: true
        type: boolean
        default: false
      app_fakegps:
        description: 'Patch fakegps'
        required: true
        type: boolean
        default: false
      app_hermit:
        description: 'Patch hermit'
        required: true
        type: boolean
        default: false
      app_hidden_settings:
        description: 'Patch hidden-settings'
        required: true
        type: boolean
        default: false
      app_ilovepdf:
        description: 'Patch ilovepdf'
        required: true
        type: boolean
        default: false
      app_key_mapper:
        description: 'Patch key-mapper'
        required: true
        type: boolean
        default: false
      app_keymate:
        description: 'Patch keymate'
        required: true
        type: boolean
        default: false
      app_manga_plus:
        description: 'Patch manga-plus'
        required: true
        type: boolean
        default: false
      app_pixellab:
        description: 'Patch pixellab'
        required: true
        type: boolean
        default: false
      app_timestamp_camera:
        description: 'Patch timestamp-camera'
        required: true
        type: boolean
        default: false
      app_nekopoi:
        description: 'Patch nekopoi'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options:
          - Latest Recommended
          - Beta
          - Custom
      custom_version:
        description: 'Custom App Version (Required if Custom is selected)'
        required: false
        default: ''
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
          - Custom Local

jobs:
  execute-patching:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize Java JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          
      - name: Initialize Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Dependencies & apkeep
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu -O apkeep
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/

      - name: Fetch Environment Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.cli_track }}" == "Pre-release" ]; then
            CLI_TAG=$(gh api repos/MorpheApp/morphe-desktop/releases | jq -r '.[0].tag_name')
            gh release download "$CLI_TAG" -R MorpheApp/morphe-desktop --pattern "morphe-desktop-*-all.jar"
          else
            gh release download -R MorpheApp/morphe-desktop --pattern "morphe-desktop-*-all.jar"
          fi
          mv morphe-desktop-*-all.jar morphe.jar
          
          REPO_URL="kiraio-moe/Lain-Patches"
          echo "TARGET_REPO_URL=https://github.com/$REPO_URL" >> $GITHUB_ENV
          
          if [ "${{ github.event.inputs.patches_track }}" == "Custom Local" ]; then
            cp "Custom-Patches/kiraio-moe-custom.mpp" patches.mpp
            echo "PATCHES_VERSION=custom-local" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.patches_track }}" == "Pre-release" ]; then
            PATCH_TAG=$(gh api repos/$REPO_URL/releases | jq -r '.[0].tag_name')
            gh release download "$PATCH_TAG" -R $REPO_URL --pattern "*.mpp"
            mv *.mpp patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> $GITHUB_ENV
          else
            PATCH_TAG=$(gh api repos/$REPO_URL/releases/latest | jq -r '.tag_name')
            gh release download "$PATCH_TAG" -R $REPO_URL --pattern "*.mpp"
            mv *.mpp patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> $GITHUB_ENV
          fi

      - name: Decode Custom Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > custom.keystore

      # --- CHECKBOX COMBINER ENGINE ---
      - name: Prepare App Selection
        id: prep_apps
        run: |
          APP_LIST=""
          if [ "${{ github.event.inputs.app_atomic }}" == "true" ]; then APP_LIST="$APP_LIST,atomic"; fi
          if [ "${{ github.event.inputs.app_audiorelay }}" == "true" ]; then APP_LIST="$APP_LIST,audiorelay"; fi
          if [ "${{ github.event.inputs.app_boorusama }}" == "true" ]; then APP_LIST="$APP_LIST,boorusama"; fi
          if [ "${{ github.event.inputs.app_epic }}" == "true" ]; then APP_LIST="$APP_LIST,epic"; fi
          if [ "${{ github.event.inputs.app_fakegps }}" == "true" ]; then APP_LIST="$APP_LIST,fakegps"; fi
          if [ "${{ github.event.inputs.app_hermit }}" == "true" ]; then APP_LIST="$APP_LIST,hermit"; fi
          if [ "${{ github.event.inputs.app_hidden_settings }}" == "true" ]; then APP_LIST="$APP_LIST,hidden-settings"; fi
          if [ "${{ github.event.inputs.app_ilovepdf }}" == "true" ]; then APP_LIST="$APP_LIST,ilovepdf"; fi
          if [ "${{ github.event.inputs.app_key_mapper }}" == "true" ]; then APP_LIST="$APP_LIST,key-mapper"; fi
          if [ "${{ github.event.inputs.app_keymate }}" == "true" ]; then APP_LIST="$APP_LIST,keymate"; fi
          if [ "${{ github.event.inputs.app_manga_plus }}" == "true" ]; then APP_LIST="$APP_LIST,manga-plus"; fi
          if [ "${{ github.event.inputs.app_pixellab }}" == "true" ]; then APP_LIST="$APP_LIST,pixellab"; fi
          if [ "${{ github.event.inputs.app_timestamp_camera }}" == "true" ]; then APP_LIST="$APP_LIST,timestamp-camera"; fi
          if [ "${{ github.event.inputs.app_nekopoi }}" == "true" ]; then APP_LIST="$APP_LIST,nekopoi"; fi
          
          # Remove leading comma (if any)
          APP_LIST=${APP_LIST#,}
          
          # Prevent error if no application is selected
          if [ -z "$APP_LIST" ]; then
            echo "::error::No applications selected for patching!"
            exit 1
          fi
          
          echo "SELECTED_APPS=$APP_LIST" >> $GITHUB_ENV
          echo "Ready to patch: $APP_LIST"

      - name: Execute Chihafuyu Tool
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
        run: |
          python -u chihafuyu_tool.py \
            --ecosystem "kiraio-moe" \
            --apps "${{ env.SELECTED_APPS }}" \
            --arch "${{ github.event.inputs.architecture }}" \
            --version-selection "${{ github.event.inputs.version_selection }}" \
            --custom-version "${{ github.event.inputs.custom_version }}" \
            --cli "morphe.jar" \
            --patches "patches.mpp" \
            --patches-version "${{ env.PATCHES_VERSION }}" \
            --repo-url "${{ env.TARGET_REPO_URL }}" \
            --keystore "custom.keystore" \
            --ks-alias "$KEYSTORE_ALIAS" \
            --ks-pass "$KEYSTORE_PASSWORD" \
            --signer "$KEYSTORE_SIGNER_NAME"

      - name: Set Release Tag
        id: vars
        run: echo "DATE_TAG=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: kiraio-moe-${{ env.DATE_TAG }}
          name: Patched Apps - kiraio-moe (${{ env.DATE_TAG }})
          body_path: ./kiraio-moe/changelog.md
          files: ./kiraio-moe/Output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
