name: 🌸 Kiraio-moe Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_atomic:
        description: 'Patch atomic'
        required: true
        type: boolean
        default: false
      app_audiorelay:
        description: 'Patch audiorelay'
        required: true
        type: boolean
        default: false
      app_boorusama:
        description: 'Patch boorusama'
        required: true
        type: boolean
        default: false
      app_epic:
        description: 'Patch epic'
        required: true
        type: boolean
        default: false
      app_fakegps:
        description: 'Patch fakegps'
        required: true
        type: boolean
        default: false
      app_hermit:
        description: 'Patch hermit'
        required: true
        type: boolean
        default: false
      app_hidden_settings:
        description: 'Patch hidden-settings'
        required: true
        type: boolean
        default: false
      app_ilovepdf:
        description: 'Patch ilovepdf'
        required: true
        type: boolean
        default: false
      app_key_mapper:
        description: 'Patch key-mapper'
        required: true
        type: boolean
        default: false
      app_keymate:
        description: 'Patch keymate'
        required: true
        type: boolean
        default: false
      app_manga_plus:
        description: 'Patch manga-plus'
        required: true
        type: boolean
        default: false
      app_pixellab:
        description: 'Patch pixellab'
        required: true
        type: boolean
        default: false
      app_timestamp_camera:
        description: 'Patch timestamp-camera'
        required: true
        type: boolean
        default: false
      app_nekopoi:
        description: 'Patch nekopoi'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options:
          - Latest Recommended
          - Beta
          - Custom
      custom_version:
        description: 'Custom App Version (Required if Custom is selected)'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - huggingface
          - archive
          - apkmirror
          - apkpure
          - apkcombo
          - aptoide
          - uptodown
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
          - Custom Local

jobs:
  execute-patching:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize Java JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Initialize Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Dependencies & apkeep
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          APKEEP_VERSION='1.0.0'
          APKEEP_ASSET='apkeep-x86_64-unknown-linux-gnu'
          APKEEP_URL="https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/${APKEEP_ASSET}"

          wget -q --show-progress --https-only "$APKEEP_URL" -O apkeep

          EXPECTED_SHA256="$(
            gh api "repos/EFForg/apkeep/releases/tags/${APKEEP_VERSION}" \
              --jq '.assets[] | select(.name == "'"$APKEEP_ASSET"'") | .digest' \
              | sed 's/^sha256://'
          )"

          if [ -z "$EXPECTED_SHA256" ] || ! printf '%s  %s\n' "$EXPECTED_SHA256" apkeep | sha256sum --check --status; then
            echo "::error::apkeep SHA-256 verification failed"
            rm -f apkeep
            exit 1
          fi

          chmod 0755 apkeep
          sudo install -m 0755 apkeep /usr/local/bin/apkeep
          rm -f apkeep
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch Environment Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TRACK: ${{ inputs.cli_track }}
          PATCHES_TRACK: ${{ inputs.patches_track }}
        run: |
          set -euo pipefail

          if [[ "$CLI_TRACK" == "Pre-release" ]]; then
            CLI_TAG="$(
              gh api repos/MorpheApp/morphe-desktop/releases \
                --paginate \
                --slurp \
                --jq 'add | map(select(.prerelease == true and .draft == false))[0].tag_name // empty'
            )"

            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::No Morphe CLI pre-release was found"
              exit 1
            fi

            gh release download "$CLI_TAG" \
              -R MorpheApp/morphe-desktop \
              --pattern "morphe-desktop-*-all.jar"
          else
            gh release download \
              -R MorpheApp/morphe-desktop \
              --pattern "morphe-desktop-*-all.jar"
          fi

          mapfile -t JARS < <(find . -maxdepth 1 -type f -name 'morphe-desktop-*-all.jar' -print | sort -V)
          if (( ${#JARS[@]} == 0 )); then
            echo "::error::Morphe CLI JAR was not downloaded"
            exit 1
          fi

          LATEST_JAR="${JARS[${#JARS[@]}-1]}"
          mv -- "$LATEST_JAR" morphe.jar

          REPO_URL="kiraio-moe/Lain-Patches"
          echo "TARGET_REPO_URL=https://github.com/$REPO_URL" >> "$GITHUB_ENV"

          if [[ "$PATCHES_TRACK" == "Custom Local" ]]; then
            test -f "Custom-Patches/kiraio-moe-custom.mpp"
            cp -- "Custom-Patches/kiraio-moe-custom.mpp" patches.mpp
            echo "PATCHES_VERSION=custom-local" >> "$GITHUB_ENV"
          elif [[ "$PATCHES_TRACK" == "Pre-release" ]]; then
            PATCH_TAG="$(
              gh api "repos/$REPO_URL/releases" \
                --paginate \
                --slurp \
                --jq 'add | map(select(.prerelease == true and .draft == false))[0].tag_name // empty'
            )"

            if [[ -z "$PATCH_TAG" ]]; then
              echo "::error::No patches pre-release was found"
              exit 1
            fi

            gh release download "$PATCH_TAG" -R "$REPO_URL" --pattern "*.mpp"
            mapfile -t MPPS < <(find . -maxdepth 1 -type f -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle was downloaded"
              exit 1
            fi

            LATEST_MPP="${MPPS[${#MPPS[@]}-1]}"
            mv -- "$LATEST_MPP" patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"
          else
            PATCH_TAG="$(gh api "repos/$REPO_URL/releases/latest" --jq '.tag_name // empty')"

            if [[ -z "$PATCH_TAG" ]]; then
              echo "::error::No stable patches release was found"
              exit 1
            fi

            gh release download "$PATCH_TAG" -R "$REPO_URL" --pattern "*.mpp"
            mapfile -t MPPS < <(find . -maxdepth 1 -type f -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle was downloaded"
              exit 1
            fi

            LATEST_MPP="${MPPS[${#MPPS[@]}-1]}"
            mv -- "$LATEST_MPP" patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"
          fi

      - name: Decode Custom Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > custom.keystore
          chmod 0600 custom.keystore

      - name: Prepare App Selection
        id: prep_apps
        env:
          APP_ATOMIC: ${{ inputs.app_atomic }}
          APP_AUDIORELAY: ${{ inputs.app_audiorelay }}
          APP_BOORUSAMA: ${{ inputs.app_boorusama }}
          APP_EPIC: ${{ inputs.app_epic }}
          APP_FAKEGPS: ${{ inputs.app_fakegps }}
          APP_HERMIT: ${{ inputs.app_hermit }}
          APP_HIDDEN_SETTINGS: ${{ inputs.app_hidden_settings }}
          APP_ILOVEPDF: ${{ inputs.app_ilovepdf }}
          APP_KEY_MAPPER: ${{ inputs.app_key_mapper }}
          APP_KEYMATE: ${{ inputs.app_keymate }}
          APP_MANGA_PLUS: ${{ inputs.app_manga_plus }}
          APP_PIXELLAB: ${{ inputs.app_pixellab }}
          APP_TIMESTAMP_CAMERA: ${{ inputs.app_timestamp_camera }}
          APP_NEKOPOI: ${{ inputs.app_nekopoi }}
        run: |
          set -euo pipefail

          APP_LIST=""
          if [[ "$APP_ATOMIC" == "true" ]]; then APP_LIST="$APP_LIST,atomic"; fi
          if [[ "$APP_AUDIORELAY" == "true" ]]; then APP_LIST="$APP_LIST,audiorelay"; fi
          if [[ "$APP_BOORUSAMA" == "true" ]]; then APP_LIST="$APP_LIST,boorusama"; fi
          if [[ "$APP_EPIC" == "true" ]]; then APP_LIST="$APP_LIST,epic"; fi
          if [[ "$APP_FAKEGPS" == "true" ]]; then APP_LIST="$APP_LIST,fakegps"; fi
          if [[ "$APP_HERMIT" == "true" ]]; then APP_LIST="$APP_LIST,hermit"; fi
          if [[ "$APP_HIDDEN_SETTINGS" == "true" ]]; then APP_LIST="$APP_LIST,hidden-settings"; fi
          if [[ "$APP_ILOVEPDF" == "true" ]]; then APP_LIST="$APP_LIST,ilovepdf"; fi
          if [[ "$APP_KEY_MAPPER" == "true" ]]; then APP_LIST="$APP_LIST,key-mapper"; fi
          if [[ "$APP_KEYMATE" == "true" ]]; then APP_LIST="$APP_LIST,keymate"; fi
          if [[ "$APP_MANGA_PLUS" == "true" ]]; then APP_LIST="$APP_LIST,manga-plus"; fi
          if [[ "$APP_PIXELLAB" == "true" ]]; then APP_LIST="$APP_LIST,pixellab"; fi
          if [[ "$APP_TIMESTAMP_CAMERA" == "true" ]]; then APP_LIST="$APP_LIST,timestamp-camera"; fi
          if [[ "$APP_NEKOPOI" == "true" ]]; then APP_LIST="$APP_LIST,nekopoi"; fi

          APP_LIST="${APP_LIST#,}"

          if [[ -z "$APP_LIST" ]]; then
            echo "::error::No applications selected for patching!"
            exit 1
          fi

          echo "SELECTED_APPS=$APP_LIST" >> "$GITHUB_ENV"
          echo "Ready to patch: $APP_LIST"

      - name: Execute Chihafuyu Tool
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
          SELECTED_APPS: ${{ env.SELECTED_APPS }}
          ARCHITECTURE: ${{ inputs.architecture }}
          VERSION_SELECTION: ${{ inputs.version_selection }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          DOWNLOAD_SOURCE: ${{ inputs.download_source }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
        run: |
          set -euo pipefail

          python -u chihafuyu_tool.py \
            --ecosystem "kiraio-moe" \
            --apps "$SELECTED_APPS" \
            --arch "$ARCHITECTURE" \
            --version-selection "$VERSION_SELECTION" \
            --custom-version "$CUSTOM_VERSION" \
            --download-source "$DOWNLOAD_SOURCE" \
            --continue-on-error "$CONTINUE_ON_ERROR" \
            --cli "morphe.jar" \
            --patches "patches.mpp" \
            --patches-version "$PATCHES_VERSION" \
            --repo-url "$TARGET_REPO_URL" \
            --keystore "custom.keystore" \
            --ks-alias "$KEYSTORE_ALIAS" \
            --ks-pass "$KEYSTORE_PASSWORD" \
            --signer "$KEYSTORE_SIGNER_NAME"

      - name: Validate Release Outputs
        run: |
          set -euo pipefail

          test -s "./kiraio-moe/changelog.md" || {
            echo "::error::Missing or empty changelog.md"
            exit 1
          }

          compgen -G "./kiraio-moe/Output/*.apk" > /dev/null || {
            echo "::error::No APK output was produced"
            exit 1
          }

      - name: Set Release Tag
        run: echo "DATE_TAG=$(date -u +'%Y.%m.%d-%H%M%S')-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: kiraio-moe-${{ env.DATE_TAG }}
          name: Patched Apps - kiraio-moe (${{ env.DATE_TAG }})
          body_path: ./kiraio-moe/changelog.md
          files: ./kiraio-moe/Output/*.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
