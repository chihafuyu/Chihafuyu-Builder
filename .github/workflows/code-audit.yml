---
name: 🛡️ Code Audit (Linter & Security)

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions: {}

jobs:
  megalinter:
    name: 🔍 MegaLinter Check
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v10
        env:
          VALIDATE_ALL_CODEBASE: 'true'
          FLAVOR_SUGGESTIONS: 'false'
          LOG_LEVEL: 'INFO'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_LINTERS: JSON_JSONLINT,YAML_YAMLLINT,ACTION_ACTIONLINT,MARKDOWN_MARKDOWNLINT,YAML_V8R,PYTHON_PYLINT
          YAML_V8R_FILE_EXTENSIONS: '[".yml", ".yaml", ".toml"]'
          FILTER_REGEX_EXCLUDE: '(patches-list.*\.json|list_.*\.txt)'
          PRE_COMMANDS: '[{"command": "pip install kurigram TgCryptoRust && if [ -f requirements.txt ]; then pip install -r requirements.txt; fi", "venv": "pylint", "run_before_linters": true}]'

  codeql:
    name: 🔒 CodeQL Security Scan
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'actions']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
