name: 🌌 Morphe Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_youtube:
        description: 'Patch YouTube'
        required: true
        type: boolean
        default: true
      app_youtube_music:
        description: 'Patch YouTube Music'
        required: true
        type: boolean
        default: true
      app_reddit:
        description: 'Patch Reddit'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options: [default, google_play, huggingface, archive, apkmirror, apkpure, apkcombo, aptoide, uptodown]
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: true

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    steps:
      - id: build-list
        run: |
          LIST=""
          if [[ "${{ inputs.app_youtube }}" == "true" ]]; then LIST="$LIST,youtube"; fi
          if [[ "${{ inputs.app_youtube_music }}" == "true" ]]; then LIST="$LIST,youtube-music"; fi
          if [[ "${{ inputs.app_reddit }}" == "true" ]]; then LIST="$LIST,reddit"; fi
          
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          echo "apps=$LIST" >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "morphe"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "MorpheApp/morphe-patches"
      custom_patch_filename: "morphe-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "morphe"
