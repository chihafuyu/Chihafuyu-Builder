---
name: 🦁 Kveld9 Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_brave_browser:
        description: 'Patch brave-browser'
        required: true
        type: boolean
        default: true
      app_hevy:
        description: 'Patch hevy'
        required: true
        type: boolean
        default: false
      app_nokoprint:
        description: 'Patch nokoprint'
        required: true
        type: boolean
        default: false
      app_tiktok_asia:
        description: 'Patch tiktok-asia'
        required: true
        type: boolean
        default: true
      app_tiktok_global:
        description: 'Patch tiktok-global'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_BRAVE_BROWSER: ${{ inputs.app_brave_browser }}
      APP_HEVY: ${{ inputs.app_hevy }}
      APP_NOKOPRINT: ${{ inputs.app_nokoprint }}
      APP_TIKTOK_ASIA: ${{ inputs.app_tiktok_asia }}
      APP_TIKTOK_GLOBAL: ${{ inputs.app_tiktok_global }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_BRAVE_BROWSER" == "true" ]]; then
            LIST="$LIST,brave-browser"
          fi
          if [[ "$APP_HEVY" == "true" ]]; then
            LIST="$LIST,hevy"
          fi
          if [[ "$APP_NOKOPRINT" == "true" ]]; then
            LIST="$LIST,nokoprint"
          fi
          if [[ "$APP_TIKTOK_ASIA" == "true" ]]; then
            LIST="$LIST,tiktok-asia"
          fi
          if [[ "$APP_TIKTOK_GLOBAL" == "true" ]]; then
            LIST="$LIST,tiktok-global"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "kveld9"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "kveld9/kveld-morphe-patches"
      custom_patch_filename: "kveld9-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "kveld9"
