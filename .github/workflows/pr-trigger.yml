---
name: PR Trigger

"on":
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge PR event
        run: echo "PR event received. Triggering Gemini reviewer workflow..."
