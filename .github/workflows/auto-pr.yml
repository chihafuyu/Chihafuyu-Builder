---
name: 📥 Open a PR to main

"on":
  push:
    branches:
      - dev
  workflow_dispatch:

permissions: {}

env:
  MESSAGE: Merge branch `${{ github.head_ref || github.ref_name }}` to `main`

jobs:
  pull-request:
    name: Open pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create or Promote Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: 'chore: ${{ env.MESSAGE }}'
          PR_BODY: |
            This pull request will ${{ env.MESSAGE }}.

            ## Before merging this PR

            - [ ] Check if the Pylint score is 10/10 🐍
            - [ ] Verify if the multi-tier downloader runs correctly 📥
            - [ ] Ensure options.json injection works ⚙️
        run: |
          PR_NUMBER=$(gh pr list \
            --base main \
            --head "${{ github.ref_name }}" \
            --json number \
            -q '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
            echo "Pull Request created successfully!"
          else
            gh pr ready "$PR_NUMBER" 2>/dev/null || true
            echo "Pull Request #$PR_NUMBER is ready for review."
          fi
