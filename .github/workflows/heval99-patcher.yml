---
name: 📧 Heval99 Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_anydesk:
        description: 'Patch anydesk'
        required: true
        type: boolean
        default: false
      app_aqua_mail:
        description: 'Patch aqua-mail'
        required: true
        type: boolean
        default: false
      app_box_box:
        description: 'Patch box-box'
        required: true
        type: boolean
        default: false
      app_easynotes:
        description: 'Patch easynotes'
        required: true
        type: boolean
        default: false
      app_fairemail:
        description: 'Patch fairemail'
        required: true
        type: boolean
        default: false
      app_iptv:
        description: 'Patch iptv'
        required: true
        type: boolean
        default: false
      app_jetaudio:
        description: 'Patch jetaudio'
        required: true
        type: boolean
        default: false
      app_osmand:
        description: 'Patch osmand'
        required: true
        type: boolean
        default: false
      app_tasker:
        description: 'Patch tasker'
        required: true
        type: boolean
        default: false
      app_textra:
        description: 'Patch textra'
        required: true
        type: boolean
        default: false
      app_unified_remote:
        description: 'Patch unified-remote'
        required: true
        type: boolean
        default: false
      app_weather_underground:
        description: 'Patch weather-underground'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
          - apkcombo
          - aptoide
          - uptodown
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_ANYDESK: ${{ inputs.app_anydesk }}
      APP_AQUA_MAIL: ${{ inputs.app_aqua_mail }}
      APP_BOX_BOX: ${{ inputs.app_box_box }}
      APP_EASYNOTES: ${{ inputs.app_easynotes }}
      APP_FAIREMAIL: ${{ inputs.app_fairemail }}
      APP_IPTV: ${{ inputs.app_iptv }}
      APP_JETAUDIO: ${{ inputs.app_jetaudio }}
      APP_OSMAND: ${{ inputs.app_osmand }}
      APP_TASKER: ${{ inputs.app_tasker }}
      APP_TEXTRA: ${{ inputs.app_textra }}
      APP_UNIFIED_REMOTE: ${{ inputs.app_unified_remote }}
      APP_WEATHER_UNDERGROUND: ${{ inputs.app_weather_underground }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_ANYDESK" == "true" ]]; then
            LIST="$LIST,anydesk"
          fi
          if [[ "$APP_AQUA_MAIL" == "true" ]]; then
            LIST="$LIST,aqua-mail"
          fi
          if [[ "$APP_BOX_BOX" == "true" ]]; then
            LIST="$LIST,box-box"
          fi
          if [[ "$APP_EASYNOTES" == "true" ]]; then
            LIST="$LIST,easynotes"
          fi
          if [[ "$APP_FAIREMAIL" == "true" ]]; then
            LIST="$LIST,fairemail"
          fi
          if [[ "$APP_IPTV" == "true" ]]; then
            LIST="$LIST,iptv"
          fi
          if [[ "$APP_JETAUDIO" == "true" ]]; then
            LIST="$LIST,jetaudio"
          fi
          if [[ "$APP_OSMAND" == "true" ]]; then
            LIST="$LIST,osmand"
          fi
          if [[ "$APP_TASKER" == "true" ]]; then
            LIST="$LIST,tasker"
          fi
          if [[ "$APP_TEXTRA" == "true" ]]; then
            LIST="$LIST,textra"
          fi
          if [[ "$APP_UNIFIED_REMOTE" == "true" ]]; then
            LIST="$LIST,unified-remote"
          fi
          if [[ "$APP_WEATHER_UNDERGROUND" == "true" ]]; then
            LIST="$LIST,weather-underground"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "heval99"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "heval99/Heval-Morphe-Patches"
      custom_patch_filename: "heval99-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "heval99"
