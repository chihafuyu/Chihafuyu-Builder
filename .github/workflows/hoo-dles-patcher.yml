---
name: 🍜 Hoo-dles Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_adguard:
        description: 'Patch adguard'
        required: true
        type: boolean
        default: false
      app_bend:
        description: 'Patch bend'
        required: true
        type: boolean
        default: false
      app_bunpo:
        description: 'Patch bunpo'
        required: true
        type: boolean
        default: false
      app_camscanner:
        description: 'Patch camscanner'
        required: true
        type: boolean
        default: false
      app_duolingo:
        description: 'Patch duolingo'
        required: true
        type: boolean
        default: false
      app_ibispaint:
        description: 'Patch ibispaint'
        required: true
        type: boolean
        default: false
      app_lightroom_mobile:
        description: 'Patch lightroom-mobile'
        required: true
        type: boolean
        default: false
      app_mimo:
        description: 'Patch mimo'
        required: true
        type: boolean
        default: false
      app_niagara_launcher:
        description: 'Patch niagara-launcher'
        required: true
        type: boolean
        default: false
      app_pydroid3:
        description: 'Patch pydroid3'
        required: true
        type: boolean
        default: false
      app_sleep_as_android:
        description: 'Patch sleep-as-android'
        required: true
        type: boolean
        default: false
      app_smart_launcher:
        description: 'Patch smart-launcher'
        required: true
        type: boolean
        default: false
      app_windy:
        description: 'Patch windy'
        required: true
        type: boolean
        default: false
      app_wps:
        description: 'Patch wps'
        required: true
        type: boolean
        default: false
      app_xodo:
        description: 'Patch xodo'
        required: true
        type: boolean
        default: false
      app_xrecorder:
        description: 'Patch xrecorder'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom]
      custom_cli_version:
        description: 'Custom CLI Version (e.g. v1.16.0)'
        required: false
        default: ''
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_ADGUARD: ${{ inputs.app_adguard }}
      APP_BEND: ${{ inputs.app_bend }}
      APP_BUNPO: ${{ inputs.app_bunpo }}
      APP_CAMSCANNER: ${{ inputs.app_camscanner }}
      APP_DUOLINGO: ${{ inputs.app_duolingo }}
      APP_IBISPAINT: ${{ inputs.app_ibispaint }}
      APP_LIGHTROOM_MOBILE: ${{ inputs.app_lightroom_mobile }}
      APP_MIMO: ${{ inputs.app_mimo }}
      APP_NIAGARA_LAUNCHER: ${{ inputs.app_niagara_launcher }}
      APP_PYDROID3: ${{ inputs.app_pydroid3 }}
      APP_SLEEP_AS_ANDROID: ${{ inputs.app_sleep_as_android }}
      APP_SMART_LAUNCHER: ${{ inputs.app_smart_launcher }}
      APP_WINDY: ${{ inputs.app_windy }}
      APP_WPS: ${{ inputs.app_wps }}
      APP_XODO: ${{ inputs.app_xodo }}
      APP_XRECORDER: ${{ inputs.app_xrecorder }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_ADGUARD" == "true" ]]; then
            LIST="$LIST,adguard"
          fi
          if [[ "$APP_BEND" == "true" ]]; then
            LIST="$LIST,bend"
          fi
          if [[ "$APP_BUNPO" == "true" ]]; then
            LIST="$LIST,bunpo"
          fi
          if [[ "$APP_CAMSCANNER" == "true" ]]; then
            LIST="$LIST,camscanner"
          fi
          if [[ "$APP_DUOLINGO" == "true" ]]; then
            LIST="$LIST,duolingo"
          fi
          if [[ "$APP_IBISPAINT" == "true" ]]; then
            LIST="$LIST,ibispaint"
          fi
          if [[ "$APP_LIGHTROOM_MOBILE" == "true" ]]; then
            LIST="$LIST,lightroom-mobile"
          fi
          if [[ "$APP_MIMO" == "true" ]]; then
            LIST="$LIST,mimo"
          fi
          if [[ "$APP_NIAGARA_LAUNCHER" == "true" ]]; then
            LIST="$LIST,niagara-launcher"
          fi
          if [[ "$APP_PYDROID3" == "true" ]]; then
            LIST="$LIST,pydroid3"
          fi
          if [[ "$APP_SLEEP_AS_ANDROID" == "true" ]]; then
            LIST="$LIST,sleep-as-android"
          fi
          if [[ "$APP_SMART_LAUNCHER" == "true" ]]; then
            LIST="$LIST,smart-launcher"
          fi
          if [[ "$APP_WINDY" == "true" ]]; then
            LIST="$LIST,windy"
          fi
          if [[ "$APP_WPS" == "true" ]]; then
            LIST="$LIST,wps"
          fi
          if [[ "$APP_XODO" == "true" ]]; then
            LIST="$LIST,xodo"
          fi
          if [[ "$APP_XRECORDER" == "true" ]]; then
            LIST="$LIST,xrecorder"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "hoo-dles"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "hoo-dles/morphe-patches"
      custom_patch_filename: "hoo-dles-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "hoo-dles"
