name: 🍜 Hoo-dles Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_adguard:
        description: 'Patch adguard'
        required: true
        type: boolean
        default: false
      app_ibispaint:
        description: 'Patch ibispaint'
        required: true
        type: boolean
        default: false
      app_wps:
        description: 'Patch wps'
        required: true
        type: boolean
        default: false
      app_camscanner:
        description: 'Patch camscanner'
        required: true
        type: boolean
        default: false
      app_sleep_as_android:
        description: 'Patch sleep-as-android'
        required: true
        type: boolean
        default: false
      app_duolingo:
        description: 'Patch duolingo'
        required: true
        type: boolean
        default: false
      app_mimo:
        description: 'Patch mimo'
        required: true
        type: boolean
        default: false
      app_windy:
        description: 'Patch windy'
        required: true
        type: boolean
        default: false
      app_xrecorder:
        description: 'Patch xrecorder'
        required: true
        type: boolean
        default: false
      app_xodo:
        description: 'Patch xodo'
        required: true
        type: boolean
        default: false
      app_lightroom_mobile:
        description: 'Patch lightroom-mobile'
        required: true
        type: boolean
        default: false
      app_myfitnesspal:
        description: 'Patch myfitnesspal'
        required: true
        type: boolean
        default: false
      app_pydroid3:
        description: 'Patch pydroid3'
        required: true
        type: boolean
        default: false
      app_smart_launcher:
        description: 'Patch smart-launcher'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options:
          - Latest Recommended
          - Beta
          - Custom
      custom_version:
        description: 'Custom App Version (Required if Custom is selected)'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - huggingface
          - archive
          - apkmirror
          - apkpure
          - apkcombo
          - aptoide
          - uptodown
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
          - Custom Local

jobs:
  execute-patching:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize Java JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Initialize Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies & apkeep
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          APKEEP_VERSION='1.0.0'
          APKEEP_ASSET='apkeep-x86_64-unknown-linux-gnu'
          APKEEP_URL="https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/${APKEEP_ASSET}"

          wget -q --show-progress --https-only "$APKEEP_URL" -O apkeep

          EXPECTED_SHA256="$(
            gh api "repos/EFForg/apkeep/releases/tags/${APKEEP_VERSION}" \
              --jq '.assets[] | select(.name == "'"$APKEEP_ASSET"'") | .digest' \
              | sed 's/^sha256://'
          )"

          if [ -z "$EXPECTED_SHA256" ] || ! printf '%s  %s\n' "$EXPECTED_SHA256" apkeep | sha256sum --check --status; then
            echo "::error::apkeep SHA-256 verification failed"
            rm -f apkeep
            exit 1
          fi

          chmod 0755 apkeep
          sudo install -m 0755 apkeep /usr/local/bin/apkeep
          rm -f apkeep
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch Environment Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TRACK: ${{ inputs.cli_track }}
          PATCHES_TRACK: ${{ inputs.patches_track }}
        run: |
          set -euo pipefail

          if [[ "$CLI_TRACK" == "Pre-release" ]]; then
            CLI_TAG="$(gh api repos/MorpheApp/morphe-desktop/releases --paginate | jq -r -s 'add | map(select(.prerelease == true and .draft == false))[0].tag_name // empty')"

            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::No Morphe CLI pre-release was found"
              exit 1
            fi

            gh release download "$CLI_TAG" \
              -R MorpheApp/morphe-desktop \
              --pattern "morphe-desktop-*-all.jar"
          else
            gh release download \
              -R MorpheApp/morphe-desktop \
              --pattern "morphe-desktop-*-all.jar"
          fi

          mapfile -t JARS < <(find . -maxdepth 1 -type f -name 'morphe-desktop-*-all.jar' -print | sort -V)
          if (( ${#JARS[@]} == 0 )); then
            echo "::error::Morphe CLI JAR was not downloaded"
            exit 1
          fi

          LATEST_JAR="${JARS[${#JARS[@]}-1]}"
          mv -- "$LATEST_JAR" morphe.jar

          REPO_URL="hoo-dles/morphe-patches"
          echo "TARGET_REPO_URL=https://github.com/$REPO_URL" >> "$GITHUB_ENV"

          if [[ "$PATCHES_TRACK" == "Custom Local" ]]; then
            test -f "Custom-Patches/hoo-dles-custom.mpp"
            cp -- "Custom-Patches/hoo-dles-custom.mpp" patches.mpp
            echo "PATCHES_VERSION=custom-local" >> "$GITHUB_ENV"
          elif [[ "$PATCHES_TRACK" == "Pre-release" ]]; then
            PATCH_TAG="$(gh api "repos/$REPO_URL/releases" --paginate | jq -r -s 'add | map(select(.prerelease == true and .draft == false))[0].tag_name // empty')"

            if [[ -z "$PATCH_TAG" ]]; then
              echo "::error::No patches pre-release was found"
              exit 1
            fi

            gh release download "$PATCH_TAG" -R "$REPO_URL" --pattern "*.mpp"
            mapfile -t MPPS < <(find . -maxdepth 1 -type f -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle was downloaded"
              exit 1
            fi

            LATEST_MPP="${MPPS[${#MPPS[@]}-1]}"
            mv -- "$LATEST_MPP" patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"
          else
            PATCH_TAG="$(gh api "repos/$REPO_URL/releases/latest" | jq -r '.tag_name // empty')"

            if [[ -z "$PATCH_TAG" ]]; then
              echo "::error::No stable patches release was found"
              exit 1
            fi

            gh release download "$PATCH_TAG" -R "$REPO_URL" --pattern "*.mpp"
            mapfile -t MPPS < <(find . -maxdepth 1 -type f -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle was downloaded"
              exit 1
            fi

            LATEST_MPP="${MPPS[${#MPPS[@]}-1]}"
            mv -- "$LATEST_MPP" patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"
          fi

      - name: Decode Custom Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > custom.keystore
          chmod 0600 custom.keystore

      - name: Evaluate Pre-release Flag
        run: |
          if [[ "${{ inputs.cli_track }}" == "Pre-release" || "${{ inputs.patches_track }}" == "Pre-release" ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Prepare App Selection
        id: prep_apps
        env:
          APP_ADGUARD: ${{ inputs.app_adguard }}
          APP_IBISPAINT: ${{ inputs.app_ibispaint }}
          APP_WPS: ${{ inputs.app_wps }}
          APP_CAMSCANNER: ${{ inputs.app_camscanner }}
          APP_SLEEP_AS_ANDROID: ${{ inputs.app_sleep_as_android }}
          APP_DUOLINGO: ${{ inputs.app_duolingo }}
          APP_MIMO: ${{ inputs.app_mimo }}
          APP_WINDY: ${{ inputs.app_windy }}
          APP_XRECORDER: ${{ inputs.app_xrecorder }}
          APP_XODO: ${{ inputs.app_xodo }}
          APP_LIGHTROOM_MOBILE: ${{ inputs.app_lightroom_mobile }}
          APP_MYFITNESSPAL: ${{ inputs.app_myfitnesspal }}
          APP_PYDROID3: ${{ inputs.app_pydroid3 }}
          APP_SMART_LAUNCHER: ${{ inputs.app_smart_launcher }}
        run: |
          set -euo pipefail

          APP_LIST=""
          if [[ "$APP_ADGUARD" == "true" ]]; then APP_LIST="$APP_LIST,adguard"; fi
          if [[ "$APP_IBISPAINT" == "true" ]]; then APP_LIST="$APP_LIST,ibispaint"; fi
          if [[ "$APP_WPS" == "true" ]]; then APP_LIST="$APP_LIST,wps"; fi
          if [[ "$APP_CAMSCANNER" == "true" ]]; then APP_LIST="$APP_LIST,camscanner"; fi
          if [[ "$APP_SLEEP_AS_ANDROID" == "true" ]]; then APP_LIST="$APP_LIST,sleep-as-android"; fi
          if [[ "$APP_DUOLINGO" == "true" ]]; then APP_LIST="$APP_LIST,duolingo"; fi
          if [[ "$APP_MIMO" == "true" ]]; then APP_LIST="$APP_LIST,mimo"; fi
          if [[ "$APP_WINDY" == "true" ]]; then APP_LIST="$APP_LIST,windy"; fi
          if [[ "$APP_XRECORDER" == "true" ]]; then APP_LIST="$APP_LIST,xrecorder"; fi
          if [[ "$APP_XODO" == "true" ]]; then APP_LIST="$APP_LIST,xodo"; fi
          if [[ "$APP_LIGHTROOM_MOBILE" == "true" ]]; then APP_LIST="$APP_LIST,lightroom-mobile"; fi
          if [[ "$APP_MYFITNESSPAL" == "true" ]]; then APP_LIST="$APP_LIST,myfitnesspal"; fi
          if [[ "$APP_PYDROID3" == "true" ]]; then APP_LIST="$APP_LIST,pydroid3"; fi
          if [[ "$APP_SMART_LAUNCHER" == "true" ]]; then APP_LIST="$APP_LIST,smart-launcher"; fi

          APP_LIST="${APP_LIST#,}"

          if [[ -z "$APP_LIST" ]]; then
            echo "::error::No applications selected for patching!"
            exit 1
          fi

          echo "SELECTED_APPS=$APP_LIST" >> "$GITHUB_ENV"
          echo "Ready to patch: $APP_LIST"

      - name: Execute Chihafuyu Tool
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
          SELECTED_APPS: ${{ env.SELECTED_APPS }}
          ARCHITECTURE: ${{ inputs.architecture }}
          VERSION_SELECTION: ${{ inputs.version_selection }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          DOWNLOAD_SOURCE: ${{ inputs.download_source }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
        run: |
          set -euo pipefail

          python -u chihafuyu_tool.py \
            --ecosystem "hoo-dles" \
            --apps "$SELECTED_APPS" \
            --arch "$ARCHITECTURE" \
            --version-selection "$VERSION_SELECTION" \
            --custom-version "$CUSTOM_VERSION" \
            --download-source "$DOWNLOAD_SOURCE" \
            --continue-on-error "$CONTINUE_ON_ERROR" \
            --cli "morphe.jar" \
            --patches "patches.mpp" \
            --patches-version "$PATCHES_VERSION" \
            --repo-url "$TARGET_REPO_URL" \
            --keystore "custom.keystore" \
            --ks-alias "$KEYSTORE_ALIAS" \
            --ks-pass "$KEYSTORE_PASSWORD" \
            --signer "$KEYSTORE_SIGNER_NAME" \
            --is-prerelease "${{ env.IS_PRERELEASE }}"

      - name: Validate Release Outputs
        run: |
          set -euo pipefail

          test -s "./hoo-dles/changelog.md" || {
            echo "::error::Missing or empty changelog.md"
            exit 1
          }

          compgen -G "./hoo-dles/Output/*.apk" > /dev/null || {
            echo "::error::No APK output was produced"
            exit 1
          }

      - name: Set Release Tag
        run: echo "DATE_TAG=$(date -u +'%Y.%m.%d-%H%M%S')-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: hoo-dles-${{ env.DATE_TAG }}
          name: Patched Apps - hoo-dles (${{ env.DATE_TAG }})
          body_path: ./hoo-dles/changelog.md
          files: ./hoo-dles/Output/*.apk
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Send to Telegram Channel
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ECOSYSTEM: "hoo-dles"
        run: |
          set -euo pipefail

          python -m pip install pyrogram tgcrypto
          python tg_upload.py
