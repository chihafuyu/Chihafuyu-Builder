name: 🍜 Hoo-dles Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_adguard:
        description: 'Patch adguard'
        required: true
        type: boolean
        default: false
      app_bend:
        description: 'Patch bend'
        required: true
        type: boolean
        default: false
      app_bunpo:
        description: 'Patch bunpo'
        required: true
        type: boolean
        default: false
      app_camscanner:
        description: 'Patch camscanner'
        required: true
        type: boolean
        default: false
      app_duolingo:
        description: 'Patch duolingo'
        required: true
        type: boolean
        default: false
      app_ibispaint:
        description: 'Patch ibispaint'
        required: true
        type: boolean
        default: false
      app_lightroom_mobile:
        description: 'Patch lightroom-mobile'
        required: true
        type: boolean
        default: false
      app_mimo:
        description: 'Patch mimo'
        required: true
        type: boolean
        default: false
      app_niagara_launcher:
        description: 'Patch niagara-launcher'
        required: true
        type: boolean
        default: false
      app_pydroid3:
        description: 'Patch pydroid3'
        required: true
        type: boolean
        default: false
      app_sleep_as_android:
        description: 'Patch sleep-as-android'
        required: true
        type: boolean
        default: false
      app_smart_launcher:
        description: 'Patch smart-launcher'
        required: true
        type: boolean
        default: false
      app_windy:
        description: 'Patch windy'
        required: true
        type: boolean
        default: false
      app_wps:
        description: 'Patch wps'
        required: true
        type: boolean
        default: false
      app_xodo:
        description: 'Patch xodo'
        required: true
        type: boolean
        default: false
      app_xrecorder:
        description: 'Patch xrecorder'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options: [default, google_play, huggingface, archive, apkmirror, apkpure, apkcombo, aptoide, uptodown]
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: true

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    steps:
      - id: build-list
        run: |
          LIST=""
          if [[ "${{ inputs.app_adguard }}" == "true" ]]; then LIST="$LIST,adguard"; fi
          if [[ "${{ inputs.app_bend }}" == "true" ]]; then LIST="$LIST,bend"; fi
          if [[ "${{ inputs.app_bunpo }}" == "true" ]]; then LIST="$LIST,bunpo"; fi
          if [[ "${{ inputs.app_camscanner }}" == "true" ]]; then LIST="$LIST,camscanner"; fi
          if [[ "${{ inputs.app_duolingo }}" == "true" ]]; then LIST="$LIST,duolingo"; fi
          if [[ "${{ inputs.app_ibispaint }}" == "true" ]]; then LIST="$LIST,ibispaint"; fi
          if [[ "${{ inputs.app_lightroom_mobile }}" == "true" ]]; then LIST="$LIST,lightroom-mobile"; fi
          if [[ "${{ inputs.app_mimo }}" == "true" ]]; then LIST="$LIST,mimo"; fi
          if [[ "${{ inputs.app_niagara_launcher }}" == "true" ]]; then LIST="$LIST,niagara-launcher"; fi
          if [[ "${{ inputs.app_pydroid3 }}" == "true" ]]; then LIST="$LIST,pydroid3"; fi
          if [[ "${{ inputs.app_sleep_as_android }}" == "true" ]]; then LIST="$LIST,sleep-as-android"; fi
          if [[ "${{ inputs.app_smart_launcher }}" == "true" ]]; then LIST="$LIST,smart-launcher"; fi
          if [[ "${{ inputs.app_windy }}" == "true" ]]; then LIST="$LIST,windy"; fi
          if [[ "${{ inputs.app_wps }}" == "true" ]]; then LIST="$LIST,wps"; fi
          if [[ "${{ inputs.app_xodo }}" == "true" ]]; then LIST="$LIST,xodo"; fi
          if [[ "${{ inputs.app_xrecorder }}" == "true" ]]; then LIST="$LIST,xrecorder"; fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then echo "::error::No applications selected!"; exit 1; fi
          echo "apps=$LIST" >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "hoo-dles"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "hoo-dles/morphe-patches"
      custom_patch_filename: "hoo-dles-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "hoo-dles"
