---
name: 🦸 Legendsciber Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_block_blast:
        description: 'Patch block-blast'
        required: true
        type: boolean
        default: false
      app_extreme_car_driving_simulator:
        description: 'Patch extreme-car-driving-simulator'
        required: true
        type: boolean
        default: false
      app_hill_climb_racing:
        description: 'Patch hill-climb-racing'
        required: true
        type: boolean
        default: false
      app_shadow_fight_2:
        description: 'Patch shadow-fight-2'
        required: true
        type: boolean
        default: false
      app_smash_hit:
        description: 'Patch smash-hit'
        required: true
        type: boolean
        default: false
      app_toolbox_for_minecraft_pe:
        description: 'Patch toolbox-for-minecraft-pe'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
          - apkcombo
          - aptoide
          - uptodown
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_BLOCK_BLAST: ${{ inputs.app_block_blast }}
      APP_EXTREME_CAR: ${{ inputs.app_extreme_car_driving_simulator }}
      APP_HILL_CLIMB: ${{ inputs.app_hill_climb_racing }}
      APP_SHADOW_FIGHT_2: ${{ inputs.app_shadow_fight_2 }}
      APP_SMASH_HIT: ${{ inputs.app_smash_hit }}
      APP_TOOLBOX: ${{ inputs.app_toolbox_for_minecraft_pe }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_BLOCK_BLAST" == "true" ]]; then
            LIST="$LIST,block-blast"
          fi
          if [[ "$APP_EXTREME_CAR" == "true" ]]; then
            LIST="$LIST,extreme-car-driving-simulator"
          fi
          if [[ "$APP_HILL_CLIMB" == "true" ]]; then
            LIST="$LIST,hill-climb-racing"
          fi
          if [[ "$APP_SHADOW_FIGHT_2" == "true" ]]; then
            LIST="$LIST,shadow-fight-2"
          fi
          if [[ "$APP_SMASH_HIT" == "true" ]]; then
            LIST="$LIST,smash-hit"
          fi
          if [[ "$APP_TOOLBOX" == "true" ]]; then
            LIST="$LIST,toolbox-for-minecraft-pe"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "legendsciber"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "legendsciber/morphe-patches"
      custom_patch_filename: "legendsciber-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "legendsciber"
