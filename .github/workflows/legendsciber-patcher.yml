---
name: 👑 Legendsciber Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_dan_the_man:
        description: 'Patch dan-the-man'
        required: true
        type: boolean
        default: false
      app_extreme_car_driving_simulator:
        description: 'Patch extreme-car-driving-simulator'
        required: true
        type: boolean
        default: false
      app_hill_climb_racing:
        description: 'Patch hill-climb-racing'
        required: true
        type: boolean
        default: false
      app_hungry_shark_evolution:
        description: 'Patch hungry-shark-evolution'
        required: true
        type: boolean
        default: false
      app_red_ball_4:
        description: 'Patch red-ball-4'
        required: true
        type: boolean
        default: false
      app_smash_hit:
        description: 'Patch smash-hit'
        required: true
        type: boolean
        default: false
      app_soccer_star:
        description: 'Patch soccer-star'
        required: true
        type: boolean
        default: false
      app_subway_surfers:
        description: 'Patch subway-surfers'
        required: true
        type: boolean
        default: false
      app_toolbox_for_minecraft_pe:
        description: 'Patch toolbox-for-minecraft-pe'
        required: true
        type: boolean
        default: false
      app_world_soccer_champs:
        description: 'Patch world-soccer-champs'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom]
      custom_cli_version:
        description: 'Custom CLI Version (e.g. v1.16.0)'
        required: false
        default: ''
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_DAN_THE_MAN: ${{ inputs.app_dan_the_man }}
      APP_EXTREME_CAR: ${{ inputs.app_extreme_car_driving_simulator }}
      APP_HILL_CLIMB: ${{ inputs.app_hill_climb_racing }}
      APP_HUNGRY_SHARK: ${{ inputs.app_hungry_shark_evolution }}
      APP_RED_BALL_4: ${{ inputs.app_red_ball_4 }}
      APP_SMASH_HIT: ${{ inputs.app_smash_hit }}
      APP_SOCCER_STAR: ${{ inputs.app_soccer_star }}
      APP_SUBWAY_SURFERS: ${{ inputs.app_subway_surfers }}
      APP_TOOLBOX: ${{ inputs.app_toolbox_for_minecraft_pe }}
      APP_WORLD_SOCCER_CHAMPS: ${{ inputs.app_world_soccer_champs }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_DAN_THE_MAN" == "true" ]]; then
            LIST="$LIST,dan-the-man"
          fi
          if [[ "$APP_EXTREME_CAR" == "true" ]]; then
            LIST="$LIST,extreme-car-driving-simulator"
          fi
          if [[ "$APP_HILL_CLIMB" == "true" ]]; then
            LIST="$LIST,hill-climb-racing"
          fi
          if [[ "$APP_HUNGRY_SHARK" == "true" ]]; then
            LIST="$LIST,hungry-shark-evolution"
          fi
          if [[ "$APP_RED_BALL_4" == "true" ]]; then
            LIST="$LIST,red-ball-4"
          fi
          if [[ "$APP_SMASH_HIT" == "true" ]]; then
            LIST="$LIST,smash-hit"
          fi
          if [[ "$APP_SOCCER_STAR" == "true" ]]; then
            LIST="$LIST,soccer-star"
          fi
          if [[ "$APP_SUBWAY_SURFERS" == "true" ]]; then
            LIST="$LIST,subway-surfers"
          fi
          if [[ "$APP_TOOLBOX" == "true" ]]; then
            LIST="$LIST,toolbox-for-minecraft-pe"
          fi
          if [[ "$APP_WORLD_SOCCER_CHAMPS" == "true" ]]; then
            LIST="$LIST,world-soccer-champs"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "legendsciber"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "legendsciber/morphe-patches"
      custom_patch_filename: "legendsciber-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "legendsciber"
