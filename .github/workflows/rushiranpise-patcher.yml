---
name: 🚀 Rushiranpise Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      apps_to_patch:
        description: >-
          Apps to patch (comma-separated, or type "all" for
          everything)
        required: true
        type: string
        default: 'all'
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom]
      custom_cli_version:
        description: 'Custom CLI Version (e.g. v1.16.0)'
        required: false
        default: ''
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    steps:
      - name: Validate and Normalize App List
        id: build-list
        env:
          APPS_RAW: ${{ inputs.apps_to_patch }}
        run: |
          set -euo pipefail

          RAW_CLEAN=$(printf '%s' "$APPS_RAW" | tr -d '[:space:]')
          if [ -z "$RAW_CLEAN" ]; then
            echo "::error::No applications specified!"
            exit 1
          fi

          ECO="rushiranpise"
          CONFIG="ecosystem/${ECO}.json"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Config not found: $CONFIG"
            exit 1
          fi

          VALID=$(CONFIG_PATH="$CONFIG" ECO_NAME="$ECO" python3 -c "
          import os, json
          with open(os.environ['CONFIG_PATH']) as f:
              data = json.load(f)[os.environ['ECO_NAME']]['apps']
          print('\n'.join(sorted(data)))
          ")

          APPS=()
          while IFS= read -r APP; do
            APP=$(printf '%s' "$APP" | tr -d '[:space:]')
            [ -z "$APP" ] && continue
            APPS+=("$APP")
          done < <(printf '%s' "$APPS_RAW" | tr ',' '\n')

          if [ ${#APPS[@]} -eq 0 ]; then
            echo "::error::Input contains no valid app names"
            exit 1
          fi

          HAS_ALL=0
          OTHERS=()
          for APP in "${APPS[@]}"; do
            if [ "${APP,,}" = "all" ]; then
              HAS_ALL=1
            else
              OTHERS+=("$APP")
            fi
          done

          if [ "$HAS_ALL" -eq 1 ]; then
            if [ ${#OTHERS[@]} -gt 0 ]; then
              echo "::warning::Token 'all' present; ignored individual app names: ${OTHERS[*]}"
            fi
            SELECTED="all"
          else
            INVALID=()
            for APP in "${APPS[@]}"; do
              if ! grep -qxF "$APP" <<< "$VALID"; then
                INVALID+=("$APP")
              fi
            done
            if [ ${#INVALID[@]} -gt 0 ]; then
              echo "::error::Unknown app(s) for ecosystem '$ECO': ${INVALID[*]}"
              echo "::error::Valid apps:"
              while IFS= read -r line; do
                echo "  - $line"
              done <<< "$VALID"
              exit 1
            fi
            SELECTED=$(IFS=,; echo "${APPS[*]}")
          fi

          {
            echo "apps<<EOF"
            echo "$SELECTED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "rushiranpise"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "rushiranpise/morphe-patches"
      custom_patch_filename: "rushiranpise-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "rushiranpise"
