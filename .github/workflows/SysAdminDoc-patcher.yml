---
name: 🛠️ SysAdminDoc Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_tiktok_global:
        description: 'Patch HushFeed'
        required: true
        type: boolean
        default: false
      app_facebook:
        description: 'Patch HushFacebook'
        required: true
        type: boolean
        default: false
      app_messenger:
        description: 'Patch HushMessenger'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom]
      custom_cli_version:
        description: 'Custom CLI Version (e.g. v1.16.0)'
        required: false
        default: ''
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  patch-tiktok-global:
    if: inputs.app_tiktok_global == true
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "SysAdminDoc"
      apps: "tiktok-global"
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "SysAdminDoc/HushFeed"
      custom_patch_filename: "hushfeed-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "hushfeed"

  patch-facebook:
    if: inputs.app_facebook == true
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "SysAdminDoc"
      apps: "facebook"
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "SysAdminDoc/HushFacebook"
      custom_patch_filename: "hushfacebook-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "hushfacebook"

  patch-messenger:
    if: inputs.app_messenger == true
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "SysAdminDoc"
      apps: "messenger"
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "SysAdminDoc/HushMessenger"
      custom_patch_filename: "hushmessenger-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "hushmessenger"
