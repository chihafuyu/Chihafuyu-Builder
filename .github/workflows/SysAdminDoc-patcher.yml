---
name: 🧰 SysAdminDoc Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_facebook:
        description: 'Patch HushFacebook'
        required: true
        type: boolean
        default: true
      app_instagram:
        description: 'Patch HushGram'
        required: true
        type: boolean
        default: false
      app_messenger:
        description: 'Patch HushMessenger'
        required: true
        type: boolean
        default: true
      app_pinedrama:
        description: 'Patch HushPinedrama (repo: HushFeed)'
        required: true
        type: boolean
        default: false
      app_pinterest:
        description: 'Patch HushPinterest'
        required: true
        type: boolean
        default: true
      app_telegram_web:
        description: 'Patch HushTelegram'
        required: true
        type: boolean
        default: false
      app_threads:
        description: 'Patch HushThreads'
        required: true
        type: boolean
        default: true
      app_tiktok_global:
        description: 'Patch HushFeed'
        required: true
        type: boolean
        default: false
      app_tumblr:
        description: 'Patch HushTumblr'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom]
      custom_cli_version:
        description: 'Custom CLI Version (e.g. v1.16.0)'
        required: false
        default: ''
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    env:
      APP_FACEBOOK: ${{ inputs.app_facebook }}
      APP_INSTAGRAM: ${{ inputs.app_instagram }}
      APP_MESSENGER: ${{ inputs.app_messenger }}
      APP_PINEDRAMA: ${{ inputs.app_pinedrama }}
      APP_PINTEREST: ${{ inputs.app_pinterest }}
      APP_TELEGRAM_WEB: ${{ inputs.app_telegram_web }}
      APP_THREADS: ${{ inputs.app_threads }}
      APP_TIKTOK_GLOBAL: ${{ inputs.app_tiktok_global }}
      APP_TUMBLR: ${{ inputs.app_tumblr }}
    steps:
      - name: Generate Dynamic Matrix
        id: build
        run: |
          set -euo pipefail
          entries=()
          add_entry() {
            entries+=("{\"app\":\"$1\",\"repo\":\"$2\",\"prefix\":\"$3\",\"mpp\":\"$4\"}")
          }
          if [[ "$APP_FACEBOOK" == "true" ]]; then
            add_entry facebook HushFacebook hushfacebook hushfacebook-custom.mpp
          fi
          if [[ "$APP_INSTAGRAM" == "true" ]]; then
            add_entry instagram HushGram hushgram hushgram-custom.mpp
          fi
          if [[ "$APP_MESSENGER" == "true" ]]; then
            add_entry messenger HushMessenger hushmessenger hushmessenger-custom.mpp
          fi
          if [[ "$APP_PINEDRAMA" == "true" ]]; then
            add_entry pinedrama HushFeed hushpinedrama hushfeed-custom.mpp
          fi
          if [[ "$APP_PINTEREST" == "true" ]]; then
            add_entry pinterest HushPinterest hushpinterest hushpinterest-custom.mpp
          fi
          if [[ "$APP_TELEGRAM_WEB" == "true" ]]; then
            add_entry telegram-web HushTelegram hushtelegram hushtelegram-custom.mpp
          fi
          if [[ "$APP_THREADS" == "true" ]]; then
            add_entry threads HushThreads hushthreads hushthreads-custom.mpp
          fi
          if [[ "$APP_TIKTOK_GLOBAL" == "true" ]]; then
            add_entry tiktok-global HushFeed hushfeed hushfeed-custom.mpp
          fi
          if [[ "$APP_TUMBLR" == "true" ]]; then
            add_entry tumblr HushTumblr hushtumblr hushtumblr-custom.mpp
          fi
          if [ ${#entries[@]} -eq 0 ]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          matrix="[$(IFS=,; echo "${entries[*]}")]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-matrix
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "SysAdminDoc"
      apps: ${{ matrix.app }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: SysAdminDoc/${{ matrix.repo }}
      custom_patch_filename: ${{ matrix.mpp }}
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: ${{ matrix.prefix }}
