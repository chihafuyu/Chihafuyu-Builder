---
name: 🔗 Lokesh-Sparrow Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_1dm:
        description: 'Patch 1dm'
        required: true
        type: boolean
        default: true
      app_adm:
        description: 'Patch adm'
        required: true
        type: boolean
        default: true
      app_doc_scanner:
        description: 'Patch doc-scanner'
        required: true
        type: boolean
        default: true
      app_google_photos:
        description: 'Patch google-photos'
        required: true
        type: boolean
        default: false
      app_linkedin:
        description: 'Patch linkedin'
        required: true
        type: boolean
        default: true
      app_mx_player_pro:
        description: 'Patch mx-player-pro'
        required: true
        type: boolean
        default: true
      app_splitwise:
        description: 'Patch splitwise'
        required: true
        type: boolean
        default: true
      app_tasker:
        description: 'Patch tasker'
        required: true
        type: boolean
        default: true
      app_trackchecker:
        description: 'Patch trackchecker'
        required: true
        type: boolean
        default: true
      app_truecaller:
        description: 'Patch truecaller'
        required: true
        type: boolean
        default: true
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        type: string
        default: ''
      custom_version_code:
        description: 'Custom Version Code (blank for auto)'
        required: false
        type: string
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom]
      custom_cli_version:
        description: 'Custom CLI Version (e.g. v1.16.0)'
        required: false
        type: string
        default: ''
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      upload_huggingface:
        description: 'Upload to HuggingFace Dataset'
        required: false
        type: boolean
        default: false
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_1DM: ${{ inputs.app_1dm }}
      APP_ADM: ${{ inputs.app_adm }}
      APP_DOC_SCANNER: ${{ inputs.app_doc_scanner }}
      APP_GOOGLE_PHOTOS: ${{ inputs.app_google_photos }}
      APP_LINKEDIN: ${{ inputs.app_linkedin }}
      APP_MX_PLAYER_PRO: ${{ inputs.app_mx_player_pro }}
      APP_SPLITWISE: ${{ inputs.app_splitwise }}
      APP_TASKER: ${{ inputs.app_tasker }}
      APP_TRACKCHECKER: ${{ inputs.app_trackchecker }}
      APP_TRUECALLER: ${{ inputs.app_truecaller }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_1DM" == "true" ]]; then
            LIST="$LIST,1dm"
          fi
          if [[ "$APP_ADM" == "true" ]]; then
            LIST="$LIST,adm"
          fi
          if [[ "$APP_DOC_SCANNER" == "true" ]]; then
            LIST="$LIST,doc-scanner"
          fi
          if [[ "$APP_GOOGLE_PHOTOS" == "true" ]]; then
            LIST="$LIST,google-photos"
          fi
          if [[ "$APP_LINKEDIN" == "true" ]]; then
            LIST="$LIST,linkedin"
          fi
          if [[ "$APP_MX_PLAYER_PRO" == "true" ]]; then
            LIST="$LIST,mx-player-pro"
          fi
          if [[ "$APP_SPLITWISE" == "true" ]]; then
            LIST="$LIST,splitwise"
          fi
          if [[ "$APP_TASKER" == "true" ]]; then
            LIST="$LIST,tasker"
          fi
          if [[ "$APP_TRACKCHECKER" == "true" ]]; then
            LIST="$LIST,trackchecker"
          fi
          if [[ "$APP_TRUECALLER" == "true" ]]; then
            LIST="$LIST,truecaller"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      HA_API_KEY: ${{ secrets.HA_API_KEY }}
      MD_API_KEY: ${{ secrets.MD_API_KEY }}
      PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
      PLAY_AAS_TOKEN: ${{ secrets.PLAY_AAS_TOKEN }}
      DEVICE_PROPERTIES_B64: ${{ secrets.DEVICE_PROPERTIES_B64 }}
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      SESSION_STRING: ${{ secrets.SESSION_STRING }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
    with:
      ecosystem: "lokesh-sparrow"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      custom_version_code: ${{ inputs.custom_version_code }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "lokesh-sparrow/loki-patches"
      custom_patch_filename: "lokesh-sparrow-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      upload_huggingface: ${{ inputs.upload_huggingface }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "lokesh-sparrow"
