---
name: ⚙️ Core Patcher Engine

"on":
  workflow_call:
    inputs:
      ecosystem:
        required: true
        type: string
      apps:
        required: true
        type: string
      architecture:
        required: true
        type: string
      version_selection:
        required: true
        type: string
      custom_version:
        required: false
        type: string
        default: ''
      custom_version_code:
        required: false
        type: string
        default: ''
      download_source:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      cli_track:
        required: true
        type: string
      custom_cli_version:
        required: false
        type: string
        default: ''
      patches_track:
        required: true
        type: string
      test_artifact_workflow:
        required: false
        type: string
        default: 'build_pull_request.yml'
      test_artifact_branch:
        required: false
        type: string
        default: 'dev'
      repo_url:
        required: true
        type: string
      custom_patch_filename:
        required: true
        type: string
      upload_github_release:
        required: true
        type: boolean
      upload_huggingface:
        required: true
        type: boolean
      send_to_telegram:
        required: true
        type: boolean
      release_tag_prefix:
        required: true
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEYSTORE_ALIAS:
        required: true
      KEYSTORE_SIGNER_NAME:
        required: true
      GEMINI_API_KEY:
        required: false
      VT_API_KEY:
        required: false
      HA_API_KEY:
        required: false
      MD_API_KEY:
        required: false
      PLAY_EMAIL:
        required: false
      PLAY_AAS_TOKEN:
        required: false
      DEVICE_PROPERTIES_B64:
        required: false
      API_ID:
        required: false
      API_HASH:
        required: false
      BOT_TOKEN:
        required: false
      SESSION_STRING:
        required: false
      CHAT_ID:
        required: false
      HF_TOKEN:
        required: false
      HF_DATASET_ID:
        required: false
      PATCH_SOURCE_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: >-
        ${{ (inputs.send_to_telegram || inputs.upload_huggingface) == true
            && 'upload-session-lock'
            || format('build-{0}-{1}', inputs.ecosystem,
                      inputs.release_tag_prefix) }}
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Disk Space Report (Before)
        run: df -h

      - name: Maximize Runner Disk Space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: >-
            azure-cli google-cloud-cli microsoft-edge-stable
            google-chrome-stable firefox postgresql* *llvm*
            mysql* dotnet-sdk-*
          remove_packages_one_command: true
          remove_folders: >-
            /usr/share/az* /usr/local/lib/node_modules
            /usr/local/share/chromium /usr/local/share/powershell
            /usr/local/aws-cli /usr/local/aws-sam-cli
            /usr/share/gradle /opt/pipx
          rm_cmd: "rmz"
          rmz_version: "3.2.0"

      - name: Disk Space Report (After)
        run: df -h

      - name: Initialize Java JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Python Environment
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Start FlareSolverr Microservice
        run: |
          set -euo pipefail

          retry() {
            local n=3
            until "$@"; do
              ((n--)) || return 1
              sleep 5
            done
          }

          IMAGE="ghcr.io/flaresolverr/flaresolverr:latest"
          retry docker pull "$IMAGE"

          DIGEST="$(
            docker inspect \
              --format='{{index .RepoDigests 0}}' "$IMAGE"
          )"
          echo "Resolved ${IMAGE} -> ${DIGEST}"

          start_flaresolverr() {
            docker rm -f flaresolverr >/dev/null 2>&1 || true
            docker run -d --name=flaresolverr \
              -p 127.0.0.1:8191:8191 \
              -e LOG_LEVEL=info \
              "$DIGEST"
          }
          retry start_flaresolverr

          echo "Waiting for FlareSolverr to initialize..."
          timeout 60 bash -c '
            while ! curl -sf http://localhost:8191/ > /dev/null; do
              sleep 2
            done
          '
          echo "FlareSolverr proxy is online!"

      - name: Install Dependencies & apkeep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt

          APKEEP_VERSION='1.1.0'
          APKEEP_ASSET='apkeep-x86_64-unknown-linux-gnu'
          DL_BASE="https://github.com/EFForg/apkeep/releases/download"
          APKEEP_URL="${DL_BASE}/${APKEEP_VERSION}/${APKEEP_ASSET}"

          wget -q --show-progress --https-only "$APKEEP_URL" -O apkeep

          JQ_Q=".assets[] | select(.name == \"$APKEEP_ASSET\") | .digest"
          EXPECTED_SHA256="$(
            gh api "repos/EFForg/apkeep/releases/tags/$APKEEP_VERSION" \
              --jq "$JQ_Q" | sed 's/^sha256://'
          )"

          if [ -z "$EXPECTED_SHA256" ] || ! printf '%s  %s\n' \
            "$EXPECTED_SHA256" apkeep | sha256sum --check --status; then
            echo "::error::apkeep SHA-256 verification failed"
            rm -f apkeep
            exit 1
          fi

          chmod 0755 apkeep
          sudo install -m 0755 apkeep /usr/local/bin/apkeep
          rm -f apkeep

      - name: Verify Security Scanner Configuration
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          HA_API_KEY: ${{ secrets.HA_API_KEY }}
          MD_API_KEY: ${{ secrets.MD_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$VT_API_KEY" && -z "$HA_API_KEY" \
                && -z "$MD_API_KEY" ]]; then
            echo "::error::CRITICAL SECURITY RISK: No malware scanners" \
              "configured."
            echo "::error::At least one of VT_API_KEY, HA_API_KEY, or" \
              "MD_API_KEY must be set in repository secrets."
            exit 1
          fi
          echo "[INFO] Security scanner configuration validated." \
            "At least one scanner is active."

      - name: Fetch Environment Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_SOURCE_TOKEN: ${{ secrets.PATCH_SOURCE_TOKEN }}
          INPUT_CLI_TRACK: ${{ inputs.cli_track }}
          INPUT_CUSTOM_CLI_VERSION: ${{ inputs.custom_cli_version }}
          INPUT_PATCHES_TRACK: ${{ inputs.patches_track }}
          INPUT_REPO_URL: ${{ inputs.repo_url }}
          INPUT_CUSTOM_PATCH_FILENAME: ${{ inputs.custom_patch_filename }}
          INPUT_TEST_ARTIFACT_WORKFLOW: ${{ inputs.test_artifact_workflow }}
          INPUT_TEST_ARTIFACT_BRANCH: ${{ inputs.test_artifact_branch }}
        run: |
          set -euo pipefail

          retry() {
            local n=3
            until "$@"; do
              ((n--)) || return 1
              sleep 5
            done
          }

          verify_digest() {
            if [ -z "$ARTIFACT_DIGEST" ]; then
              echo "::warning::Artifact $ARTIFACT_ID exposes no digest;" \
                "skipping integrity verification."
              return 0
            fi
            local actual
            actual="$(sha256sum "$1" | cut -d' ' -f1)"
            if [ "$actual" == "$ARTIFACT_DIGEST" ]; then
              echo "[INFO] SHA-256 verified: $1 matches artifact digest."
              return 0
            fi
            if [ -f "$ARTIFACT_ZIP" ]; then
              local wrapper
              wrapper="$(sha256sum "$ARTIFACT_ZIP" | cut -d' ' -f1)"
              if [ "$wrapper" == "$ARTIFACT_DIGEST" ]; then
                echo "[INFO] Legacy artifact: digest matches the" \
                  "stored ZIP wrapper."
                return 0
              fi
            fi
            echo "::error::SHA-256 mismatch for $1:" \
              "expected $ARTIFACT_DIGEST, got $actual"
            exit 1
          }

          if [[ ! "$INPUT_REPO_URL" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::repo_url must be 'owner/repo', got: $INPUT_REPO_URL"
            exit 1
          fi
          echo "TARGET_REPO_URL=https://github.com/$INPUT_REPO_URL" \
            >> "$GITHUB_ENV"

          # --- Resolve CLI tag ---
          if [[ "$INPUT_CLI_TRACK" == "Custom" ]]; then
            CLI_TAG="$INPUT_CUSTOM_CLI_VERSION"
            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::Custom CLI version input is empty!"
              exit 1
            fi
          elif [[ "$INPUT_CLI_TRACK" == "Pre-release" ]]; then
            JQ_FLTR='add | map(select(.prerelease==true and .draft==false))'
            JQ_FLTR="${JQ_FLTR} | .[].tag_name"
            CLI_TAG="$(gh api repos/MorpheApp/morphe-desktop/releases \
              --paginate | jq -r -s "$JQ_FLTR" | sort -V | tail -n 1)"
            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::No Morphe CLI pre-release was found"
              exit 1
            fi
          else
            CLI_TAG="$(gh api repos/MorpheApp/morphe-desktop/releases/latest \
              | jq -r '.tag_name // empty')"
            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::No stable Morphe CLI release was found"
              exit 1
            fi
          fi
          echo "CLI_VERSION=$CLI_TAG" >> "$GITHUB_ENV"

          CLI_DIR=".cli_download"
          rm -rf "$CLI_DIR"
          mkdir -p "$CLI_DIR"
          retry gh release download "$CLI_TAG" -R MorpheApp/morphe-desktop \
            --pattern "morphe-desktop-*-all.jar" -D "$CLI_DIR"

          mapfile -t JARS < <(find "$CLI_DIR" -maxdepth 1 -type f \
            -name 'morphe-desktop-*-all.jar' -print | sort -V)
          if (( ${#JARS[@]} == 0 )); then
            echo "::error::Morphe CLI JAR was not downloaded"
            exit 1
          fi
          mv -- "${JARS[${#JARS[@]}-1]}" morphe.jar

          # --- Resolve patches ---
          if [[ "$INPUT_PATCHES_TRACK" == "Custom Local" ]]; then
            CUSTOM_PATCH="Custom-Patches/$INPUT_CUSTOM_PATCH_FILENAME"
            if [[ ! -f "$CUSTOM_PATCH" ]]; then
              echo "::error::Custom patch not found: $CUSTOM_PATCH"
              ls -la Custom-Patches/ 2>/dev/null \
                || echo "(no Custom-Patches/ directory)"
              exit 1
            fi
            if [[ ! -s "$CUSTOM_PATCH" ]]; then
              echo "::error::Custom patch is empty: $CUSTOM_PATCH"
              exit 1
            fi
            cp -- "$CUSTOM_PATCH" patches.mpp
            echo "PATCHES_VERSION=custom-local" >> "$GITHUB_ENV"

          elif [[ "$INPUT_PATCHES_TRACK" == "Test Artifact" ]]; then
            if [[ -z "${PATCH_SOURCE_TOKEN:-}" ]]; then
              echo "::error::Test Artifact needs the PATCH_SOURCE_TOKEN" \
                "secret to read GitHub Actions artifacts."
              echo "::error::Create a fine-grained PAT with 'Actions: Read'" \
                "for $INPUT_REPO_URL and add it as a repository secret."
              exit 1
            fi

            TEST_WORKFLOW="${INPUT_TEST_ARTIFACT_WORKFLOW:-build_pull_request.yml}"
            TEST_BRANCH="${INPUT_TEST_ARTIFACT_BRANCH:-dev}"
            if [[ ! "$TEST_WORKFLOW" =~ ^[A-Za-z0-9._-]+\.ya?ml$ ]]; then
              echo "::error::test_artifact_workflow must be a workflow" \
                "file name, got: $TEST_WORKFLOW"
              exit 1
            fi
            if [[ ! "$TEST_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::test_artifact_branch contains unsupported" \
                "characters: $TEST_BRANCH"
              exit 1
            fi

            AUTH_TOKEN="$PATCH_SOURCE_TOKEN"
            API_ACCEPT="Accept: application/vnd.github+json"
            API_VERSION="X-GitHub-Api-Version: 2026-03-10"

            api_get() {
              curl -sSLf \
                -H "Authorization: Bearer $AUTH_TOKEN" \
                -H "$API_ACCEPT" \
                -H "$API_VERSION" \
                "$1"
            }

            echo "[INFO] Fetching latest Test Artifact from" \
              "$INPUT_REPO_URL ($TEST_BRANCH)..."
            ENCODED_BRANCH="$(jq -rn \
              --arg value "$TEST_BRANCH" '$value | @uri')"
            RUNS_URL="https://api.github.com/repos/$INPUT_REPO_URL/actions/"
            RUNS_URL+="workflows/$TEST_WORKFLOW/runs?"
            RUNS_URL+="status=success&branch=$ENCODED_BRANCH&per_page=20"

            if ! RUNS_JSON="$(api_get "$RUNS_URL")"; then
              echo "::error::Could not list workflow runs from" \
                "$INPUT_REPO_URL."
              echo "::error::Verify that PATCH_SOURCE_TOKEN can read" \
                "Actions for that repository."
              exit 1
            fi

            # Only trust runs built by the upstream repository itself. A
            # fork pull request can reuse the same branch name, but its
            # artifact must never be applied with this repository's secrets.
            REPO_KEY="$(printf '%s' "$INPUT_REPO_URL" \
              | tr '[:upper:]' '[:lower:]')"
            mapfile -t RUN_IDS < <(jq -r --arg repo "$REPO_KEY" '
              .workflow_runs[]
              | select((.head_repository.full_name // "")
                       | ascii_downcase == $repo)
              | .id
            ' <<<"$RUNS_JSON")
            if (( ${#RUN_IDS[@]} == 0 )); then
              echo "::error::No successful $TEST_WORKFLOW run from" \
                "$INPUT_REPO_URL itself found on branch $TEST_BRANCH."
              exit 1
            fi

            RUN_ID=""
            ARTIFACT_ID=""
            ARTIFACT_NAME=""
            ARTIFACT_DIGEST=""
            for CANDIDATE_RUN in "${RUN_IDS[@]}"; do
              ARTIFACTS_URL="https://api.github.com/repos/"
              ARTIFACTS_URL+="$INPUT_REPO_URL/actions/runs/"
              ARTIFACTS_URL+="$CANDIDATE_RUN/artifacts?per_page=100"
              if ! ARTIFACTS_JSON="$(api_get "$ARTIFACTS_URL")"; then
                echo "[WARN] Could not list artifacts for run" \
                  "$CANDIDATE_RUN; trying an older run."
                continue
              fi

              # Prefer a bundle named *.mpp (Morphe) or one whose name
              # mentions patches (Piko's patches-bundle). Fall back to the
              # first unexpired artifact.
              SELECTED="$(jq -c '
                ([.artifacts[]
                  | select(.expired == false)
                  | select((.name | endswith(".mpp"))
                           or (.name | test("patch"; "i")))] | first)
                // ([.artifacts[] | select(.expired == false)] | first)
                // empty
              ' <<<"$ARTIFACTS_JSON")"
              if [[ -z "$SELECTED" || "$SELECTED" == "null" ]]; then
                echo "[WARN] Run $CANDIDATE_RUN has no unexpired" \
                  "artifact; trying an older run."
                continue
              fi

              RUN_ID="$CANDIDATE_RUN"
              ARTIFACT_ID="$(jq -r '.id' <<<"$SELECTED")"
              ARTIFACT_NAME="$(jq -r '.name // ""' <<<"$SELECTED")"
              ARTIFACT_DIGEST="$(jq -r '.digest // ""' <<<"$SELECTED" \
                | sed 's/^sha256://')"
              break
            done

            if [[ -z "$ARTIFACT_ID" ]]; then
              echo "::error::No unexpired artifact found in the latest" \
                "successful runs of $INPUT_REPO_URL."
              exit 1
            fi

            echo "[INFO] Using run $RUN_ID, artifact $ARTIFACT_ID" \
              "($ARTIFACT_NAME)."

            # The artifact API exposes the SHA-256 digest of the stored ZIP
            # wrapper. verify_digest checks either the extracted bundle or
            # the wrapper, so a tampered or wrong payload still fails.
            echo "[INFO] Downloading artifact $ARTIFACT_ID..."
            ARTIFACT_DIR=".artifact_download"
            rm -rf "$ARTIFACT_DIR"
            mkdir -p "$ARTIFACT_DIR"
            DOWNLOAD_URL="https://api.github.com/repos/$INPUT_REPO_URL/"
            DOWNLOAD_URL+="actions/artifacts/$ARTIFACT_ID/zip"

            if ! curl -sSLf \
              -H "Authorization: Bearer $AUTH_TOKEN" \
              -H "$API_ACCEPT" \
              -H "$API_VERSION" \
              "$DOWNLOAD_URL" \
              -o "$ARTIFACT_DIR/artifact.zip"; then
              echo "::error::Artifact download failed for run $RUN_ID."
              echo "::error::The artifact may have expired or the token" \
                "may lack Actions: Read."
              exit 1
            fi

            if [ ! -s "$ARTIFACT_DIR/artifact.zip" ]; then
              echo "::error::Artifact download produced an empty file."
              exit 1
            fi

            ARTIFACT_ZIP="$ARTIFACT_DIR/artifact.zip"
            if unzip -l "$ARTIFACT_ZIP" 2>/dev/null \
              | grep -Eq '\.mpp[[:space:]]*$'; then
              unzip -q -o "$ARTIFACT_ZIP" -d "$ARTIFACT_DIR"
              mapfile -t MPPS < <(find "$ARTIFACT_DIR" -type f \
                -name '*.mpp' -print | sort -V)
              if (( ${#MPPS[@]} == 0 )); then
                echo "::error::No .mpp file found inside artifact" \
                  "$ARTIFACT_ID"
                exit 1
              fi
              mv -- "${MPPS[${#MPPS[@]}-1]}" patches.mpp
              verify_digest patches.mpp
            else
              # Fallback: the endpoint served the raw artifact stream. A
              # patch bundle is zip-format with no .mpp member inside, so
              # the payload is used directly as patches.mpp. verify_digest
              # rejects anything but the exact uploaded bundle.
              echo "[INFO] No .mpp member inside the payload; using it" \
                "as the raw patch bundle."
              mv -- "$ARTIFACT_ZIP" patches.mpp
              verify_digest patches.mpp
            fi

            if [ ! -s patches.mpp ]; then
              echo "::error::Downloaded patches.mpp is empty or failed."
              exit 1
            fi
            rm -rf "$ARTIFACT_DIR"

            echo "PATCHES_VERSION=test-$RUN_ID" >> "$GITHUB_ENV"
            echo "[INFO] Successfully fetched patches.mpp from test artifact"

          else
            if [[ "$INPUT_PATCHES_TRACK" == "Pre-release" ]]; then
              JQ_FLTR='add | map(select(.prerelease==true and .draft==false))'
              JQ_FLTR="${JQ_FLTR} | .[].tag_name"
              PATCH_TAG="$(gh api "repos/$INPUT_REPO_URL/releases" \
                --paginate | jq -r -s "$JQ_FLTR" | sort -V | tail -n 1)"
              if [[ -z "$PATCH_TAG" ]]; then
                echo "::error::No patches pre-release found in $INPUT_REPO_URL"
                exit 1
              fi
            else
              PATCH_TAG="$(gh api "repos/$INPUT_REPO_URL/releases/latest" \
                | jq -r '.tag_name // empty')"
              if [[ -z "$PATCH_TAG" ]]; then
                echo "::error::No stable patches release found in" \
                  "$INPUT_REPO_URL"
                exit 1
              fi
            fi

            MPP_DIR=".patches_download"
            rm -rf "$MPP_DIR"
            mkdir -p "$MPP_DIR"
            retry gh release download "$PATCH_TAG" -R "$INPUT_REPO_URL" \
              --pattern "*.mpp" -D "$MPP_DIR"

            mapfile -t MPPS < <(find "$MPP_DIR" -maxdepth 1 -type f \
              -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle downloaded"
              exit 1
            fi
            mv -- "${MPPS[${#MPPS[@]}-1]}" patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"
          fi

      - name: Decode Custom Keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "::warning::KEYSTORE_BASE64 is not set; patched APKs will" \
              "be signed with the Morphe default keystore."
            echo "USE_KEYSTORE=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > custom.keystore
          chmod 0600 custom.keystore
          echo "USE_KEYSTORE=true" >> "$GITHUB_OUTPUT"

      - name: Evaluate Pre-release Flag
        env:
          INPUT_CLI_TRACK: ${{ inputs.cli_track }}
          INPUT_PATCHES_TRACK: ${{ inputs.patches_track }}
          INPUT_VERSION_SELECTION: ${{ inputs.version_selection }}
        run: |
          set -euo pipefail

          if [[ "$INPUT_CLI_TRACK" == "Pre-release" || \
                "$INPUT_PATCHES_TRACK" == "Pre-release" || \
                "$INPUT_PATCHES_TRACK" == "Custom Local" || \
                "$INPUT_PATCHES_TRACK" == "Test Artifact" || \
                "$INPUT_VERSION_SELECTION" == "Beta" ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Execute Chihafuyu Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
          USE_KEYSTORE: ${{ steps.keystore.outputs.USE_KEYSTORE }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          HA_API_KEY: ${{ secrets.HA_API_KEY }}
          MD_API_KEY: ${{ secrets.MD_API_KEY }}
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          PLAY_AAS_TOKEN: ${{ secrets.PLAY_AAS_TOKEN }}
          DEVICE_PROPERTIES_B64: ${{ secrets.DEVICE_PROPERTIES_B64 }}
          INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
          INPUT_APPS: ${{ inputs.apps }}
          INPUT_ARCH: ${{ inputs.architecture }}
          INPUT_VERSION_SELECTION: ${{ inputs.version_selection }}
          INPUT_CUSTOM_VERSION: ${{ inputs.custom_version }}
          INPUT_CUSTOM_VERSION_CODE: ${{ inputs.custom_version_code }}
          INPUT_DOWNLOAD_SOURCE: ${{ inputs.download_source }}
          INPUT_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INPUT_CLI_TRACK: ${{ inputs.cli_track }}
          INPUT_CUSTOM_CLI_VERSION: ${{ inputs.custom_cli_version }}
        run: |
          set -euo pipefail

          KEYSTORE_OPTS=()
          if [[ "$USE_KEYSTORE" == "true" ]]; then
            KEYSTORE_OPTS=(
              --keystore "custom.keystore"
              --ks-alias "$KEYSTORE_ALIAS"
              --ks-pass "$KEYSTORE_PASSWORD"
              --signer "$KEYSTORE_SIGNER_NAME"
            )
          fi

          python -u main.py \
            --ecosystem "$INPUT_ECOSYSTEM" \
            --apps "$INPUT_APPS" \
            --arch "$INPUT_ARCH" \
            --version-selection "$INPUT_VERSION_SELECTION" \
            --custom-version "$INPUT_CUSTOM_VERSION" \
            --custom-version-code "$INPUT_CUSTOM_VERSION_CODE" \
            --download-source "$INPUT_DOWNLOAD_SOURCE" \
            --continue-on-error "$INPUT_CONTINUE_ON_ERROR" \
            --cli "morphe.jar" \
            --cli-version "$CLI_VERSION" \
            --patches "patches.mpp" \
            --patches-version "$PATCHES_VERSION" \
            --repo-url "$TARGET_REPO_URL" \
            --is-prerelease "$IS_PRERELEASE" \
            "${KEYSTORE_OPTS[@]}"

          rm -rf "./$INPUT_ECOSYSTEM/Input" "./$INPUT_ECOSYSTEM/Staging"

      - name: Validate Release Outputs
        env:
          INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
        run: |
          set -euo pipefail
          test -s "./$INPUT_ECOSYSTEM/changelog.md" || {
            echo "::error::Missing or empty changelog.md"
            exit 1
          }
          compgen -G "./$INPUT_ECOSYSTEM/Output/*.apk" > /dev/null || {
            echo "::error::No APK output was produced"
            exit 1
          }

          APK_COUNT=$(find "./$INPUT_ECOSYSTEM/Output" -maxdepth 1 \
            -type f -name '*.apk' | wc -l)
          JSON_COUNT=$(find "./$INPUT_ECOSYSTEM/Output" -maxdepth 1 \
            -type f -name '*.json' | wc -l)
          LOG_COUNT=$(find "./$INPUT_ECOSYSTEM/Output" -maxdepth 1 \
            -type f -name '*.txt' | wc -l)

          printf '[INFO] Export summary: %s APK, %s JSON, %s TXT\n' \
            "$APK_COUNT" "$JSON_COUNT" "$LOG_COUNT"

          if [[ "$JSON_COUNT" -eq 0 && "$LOG_COUNT" -eq 0 ]]; then
            echo "::warning::No options.json or log exports were generated."
          fi

      - name: Publish to GitHub Releases
        if: inputs.upload_github_release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ inputs.release_tag_prefix }}-${{ github.run_id }}
          name: >-
            Patched Apps - ${{ inputs.release_tag_prefix }}
            (${{ github.run_id }})
          body_path: ./${{ inputs.ecosystem }}/changelog.md
          files: |
            ./${{ inputs.ecosystem }}/Output/*.apk
            ./${{ inputs.ecosystem }}/Output/*.json
            ./${{ inputs.ecosystem }}/Output/*.txt
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to HuggingFace Dataset
        if: inputs.upload_huggingface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
          ECOSYSTEM: ${{ inputs.ecosystem }}
        run: |
          set -euo pipefail
          python hf_upload.py

      - name: Send to Telegram Channel
        if: inputs.send_to_telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ECOSYSTEM: ${{ inputs.ecosystem }}
        run: |
          set -euo pipefail
          python tg_upload.py
