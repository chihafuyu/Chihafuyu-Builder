---
name: ⚙️ Core Patcher Engine

"on":
  workflow_call:
    inputs:
      ecosystem:
        required: true
        type: string
      apps:
        required: true
        type: string
      architecture:
        required: true
        type: string
      version_selection:
        required: true
        type: string
      custom_version:
        required: false
        type: string
        default: ''
      download_source:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      cli_track:
        required: true
        type: string
      custom_cli_version:
        required: false
        type: string
        default: ''
      patches_track:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      custom_patch_filename:
        required: true
        type: string
      upload_github_release:
        required: true
        type: boolean
      upload_huggingface:
        required: false
        type: boolean
        default: false
      send_to_telegram:
        required: true
        type: boolean
      release_tag_prefix:
        required: true
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEYSTORE_ALIAS:
        required: true
      KEYSTORE_SIGNER_NAME:
        required: true
      GEMINI_API_KEY:
        required: false
      VT_API_KEY:
        required: false
      HA_API_KEY:
        required: false
      MD_API_KEY:
        required: false
      PLAY_EMAIL:
        required: false
      PLAY_AAS_TOKEN:
        required: false
      DEVICE_PROPERTIES_B64:
        required: false
      API_ID:
        required: false
      API_HASH:
        required: false
      SESSION_STRING:
        required: false
      CHAT_ID:
        required: false
      HF_TOKEN:
        required: false
      HF_DATASET_ID:
        required: false

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: >-
        ${{ (inputs.send_to_telegram || inputs.upload_huggingface) == true
            && 'upload-session-lock'
            || format('build-{0}-{1}', inputs.ecosystem,
                      inputs.release_tag_prefix) }}
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Maximize Runner Disk Space
        id: disk_cleanup
        uses: justinthelaw/maximize-github-runner-space@master
        with:
          cleanup-profile: 'max'
          skip-components: 'java,docker-engine'

      - name: Show Disk Space Reclaimed
        run: |
          echo "=== DISK SPACE REPORT ==="
          echo "Available Before: ${{ steps.disk_cleanup.outputs.available-bytes-before }} bytes"
          echo "Available After: ${{ steps.disk_cleanup.outputs.available-bytes-after }} bytes"
          echo "Total Space Freed: ${{ steps.disk_cleanup.outputs.reclaimed-bytes }} bytes"

      - name: Initialize Java JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Python Environment
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Start FlareSolverr Microservice
        run: |
          set -euo pipefail

          retry() {
            local n=3
            until "$@"; do
              ((n--)) || return 1
              sleep 5
            done
          }

          IMAGE="ghcr.io/flaresolverr/flaresolverr:latest"
          retry docker pull "$IMAGE"

          DIGEST="$(
            docker inspect \
              --format='{{index .RepoDigests 0}}' "$IMAGE"
          )"
          echo "Resolved ${IMAGE} -> ${DIGEST}"

          docker run -d --name=flaresolverr \
            -p 127.0.0.1:8191:8191 \
            -e LOG_LEVEL=info \
            "$IMAGE"

          echo "Waiting for FlareSolverr to initialize..."
          timeout 30 bash -c '
            while ! curl -sf http://localhost:8191/ > /dev/null; do
              sleep 2
            done
          '
          echo "FlareSolverr proxy is online!"

      - name: Install Dependencies & apkeep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt \
            huggingface_hub

          APKEEP_VERSION='1.1.0'
          APKEEP_ASSET='apkeep-x86_64-unknown-linux-gnu'
          DL_BASE="https://github.com/EFForg/apkeep/releases/download"
          APKEEP_URL="${DL_BASE}/${APKEEP_VERSION}/${APKEEP_ASSET}"

          wget -q --show-progress --https-only "$APKEEP_URL" -O apkeep

          JQ_Q=".assets[] | select(.name == \"$APKEEP_ASSET\") | .digest"
          EXPECTED_SHA256="$(
            gh api "repos/EFForg/apkeep/releases/tags/$APKEEP_VERSION" \
              --jq "$JQ_Q" | sed 's/^sha256://'
          )"

          if [ -z "$EXPECTED_SHA256" ] || ! printf '%s  %s\n' \
            "$EXPECTED_SHA256" apkeep | sha256sum --check --status; then
            echo "::error::apkeep SHA-256 verification failed"
            rm -f apkeep
            exit 1
          fi

          chmod 0755 apkeep
          sudo install -m 0755 apkeep /usr/local/bin/apkeep
          rm -f apkeep

      - name: Fetch Environment Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CLI_TRACK: ${{ inputs.cli_track }}
          INPUT_CUSTOM_CLI_VERSION: ${{ inputs.custom_cli_version }}
          INPUT_PATCHES_TRACK: ${{ inputs.patches_track }}
          INPUT_REPO_URL: ${{ inputs.repo_url }}
          INPUT_CUSTOM_PATCH_FILENAME: ${{ inputs.custom_patch_filename }}
        run: |
          set -euo pipefail

          retry() {
            local n=3
            until "$@"; do
              ((n--)) || return 1
              sleep 5
            done
          }

          if [[ "$INPUT_REPO_URL" == *://* ]]; then
            echo "::error::repo_url must be 'owner/repo', got: $INPUT_REPO_URL"
            exit 1
          fi
          echo "TARGET_REPO_URL=https://github.com/$INPUT_REPO_URL" \
            >> "$GITHUB_ENV"

          # --- Resolve CLI tag ---
          if [[ "$INPUT_CLI_TRACK" == "Custom" ]]; then
            CLI_TAG="$INPUT_CUSTOM_CLI_VERSION"
            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::Custom CLI version input is empty!"
              exit 1
            fi
          elif [[ "$INPUT_CLI_TRACK" == "Pre-release" ]]; then
            JQ_FLTR='add | map(select(.prerelease==true and .draft==false))'
            JQ_FLTR="${JQ_FLTR} | .[].tag_name"
            CLI_TAG="$(gh api repos/MorpheApp/morphe-desktop/releases \
              --paginate | jq -r -s "$JQ_FLTR" | sort -V | tail -n 1)"
            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::No Morphe CLI pre-release was found"
              exit 1
            fi
          else
            CLI_TAG="$(gh api repos/MorpheApp/morphe-desktop/releases/latest \
              | jq -r '.tag_name // empty')"
            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::No stable Morphe CLI release was found"
              exit 1
            fi
          fi
          echo "CLI_VERSION=$CLI_TAG" >> "$GITHUB_ENV"

          CLI_DIR=".cli_download"
          rm -rf "$CLI_DIR"
          mkdir -p "$CLI_DIR"
          retry gh release download "$CLI_TAG" -R MorpheApp/morphe-desktop \
            --pattern "morphe-desktop-*-all.jar" -D "$CLI_DIR"

          mapfile -t JARS < <(find "$CLI_DIR" -maxdepth 1 -type f \
            -name 'morphe-desktop-*-all.jar' -print | sort -V)
          if (( ${#JARS[@]} == 0 )); then
            echo "::error::Morphe CLI JAR was not downloaded"
            exit 1
          fi
          mv -- "${JARS[${#JARS[@]}-1]}" morphe.jar

          # --- Resolve patches ---
          if [[ "$INPUT_PATCHES_TRACK" == "Custom Local" ]]; then
            CUSTOM_PATCH="Custom-Patches/$INPUT_CUSTOM_PATCH_FILENAME"
            if [[ ! -f "$CUSTOM_PATCH" ]]; then
              echo "::error::Custom patch not found: $CUSTOM_PATCH"
              ls -la Custom-Patches/ 2>/dev/null || echo "(no Custom-Patches/ directory)"
              exit 1
            fi
            if [[ ! -s "$CUSTOM_PATCH" ]]; then
              echo "::error::Custom patch is empty: $CUSTOM_PATCH"
              exit 1
            fi
            cp -- "$CUSTOM_PATCH" patches.mpp
            echo "PATCHES_VERSION=custom-local" >> "$GITHUB_ENV"
          else
            if [[ "$INPUT_PATCHES_TRACK" == "Pre-release" ]]; then
              JQ_FLTR='add | map(select(.prerelease==true and .draft==false))'
              JQ_FLTR="${JQ_FLTR} | .[].tag_name"
              PATCH_TAG="$(gh api "repos/$INPUT_REPO_URL/releases" \
                --paginate | jq -r -s "$JQ_FLTR" | sort -V | tail -n 1)"
              if [[ -z "$PATCH_TAG" ]]; then
                echo "::error::No patches pre-release found in $INPUT_REPO_URL"
                exit 1
              fi
            else
              PATCH_TAG="$(gh api "repos/$INPUT_REPO_URL/releases/latest" \
                | jq -r '.tag_name // empty')"
              if [[ -z "$PATCH_TAG" ]]; then
                echo "::error::No stable patches release found in $INPUT_REPO_URL"
                exit 1
              fi
            fi

            MPP_DIR=".patches_download"
            rm -rf "$MPP_DIR"
            mkdir -p "$MPP_DIR"
            retry gh release download "$PATCH_TAG" -R "$INPUT_REPO_URL" \
              --pattern "*.mpp" -D "$MPP_DIR"

            mapfile -t MPPS < <(find "$MPP_DIR" -maxdepth 1 -type f \
              -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle downloaded"
              exit 1
            fi
            mv -- "${MPPS[${#MPPS[@]}-1]}" patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"
          fi

      - name: Decode Custom Keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "::warning::KEYSTORE_BASE64 is not set; patched APKs will be signed with the Morphe default keystore."
            echo "USE_KEYSTORE=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > custom.keystore
          chmod 0600 custom.keystore
          echo "USE_KEYSTORE=true" >> "$GITHUB_OUTPUT"

      - name: Evaluate Pre-release Flag
        env:
          INPUT_CLI_TRACK: ${{ inputs.cli_track }}
          INPUT_PATCHES_TRACK: ${{ inputs.patches_track }}
          INPUT_VERSION_SELECTION: ${{ inputs.version_selection }}
        run: |
          set -euo pipefail

          if [[ "$INPUT_CLI_TRACK" == "Pre-release" || \
                "$INPUT_PATCHES_TRACK" == "Pre-release" || \
                "$INPUT_PATCHES_TRACK" == "Custom Local" || \
                "$INPUT_VERSION_SELECTION" == "Beta" ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Execute Chihafuyu Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
          USE_KEYSTORE: ${{ steps.keystore.outputs.USE_KEYSTORE }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          HA_API_KEY: ${{ secrets.HA_API_KEY }}
          MD_API_KEY: ${{ secrets.MD_API_KEY }}
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          PLAY_AAS_TOKEN: ${{ secrets.PLAY_AAS_TOKEN }}
          DEVICE_PROPERTIES_B64: ${{ secrets.DEVICE_PROPERTIES_B64 }}
          INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
          INPUT_APPS: ${{ inputs.apps }}
          INPUT_ARCH: ${{ inputs.architecture }}
          INPUT_VERSION_SELECTION: ${{ inputs.version_selection }}
          INPUT_CUSTOM_VERSION: ${{ inputs.custom_version }}
          INPUT_DOWNLOAD_SOURCE: ${{ inputs.download_source }}
          INPUT_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INPUT_CLI_TRACK: ${{ inputs.cli_track }}
          INPUT_CUSTOM_CLI_VERSION: ${{ inputs.custom_cli_version }}
        run: |
          set -euo pipefail

          KEYSTORE_OPTS=()
          if [[ "$USE_KEYSTORE" == "true" ]]; then
            KEYSTORE_OPTS=(
              --keystore "custom.keystore"
              --ks-alias "$KEYSTORE_ALIAS"
              --ks-pass "$KEYSTORE_PASSWORD"
              --signer "$KEYSTORE_SIGNER_NAME"
            )
          fi

          python -u main.py \
            --ecosystem "$INPUT_ECOSYSTEM" \
            --apps "$INPUT_APPS" \
            --arch "$INPUT_ARCH" \
            --version-selection "$INPUT_VERSION_SELECTION" \
            --custom-version "$INPUT_CUSTOM_VERSION" \
            --download-source "$INPUT_DOWNLOAD_SOURCE" \
            --continue-on-error "$INPUT_CONTINUE_ON_ERROR" \
            --cli "morphe.jar" \
            --cli-version "$CLI_VERSION" \
            --patches "patches.mpp" \
            --patches-version "$PATCHES_VERSION" \
            --repo-url "$TARGET_REPO_URL" \
            --is-prerelease "$IS_PRERELEASE" \
            "${KEYSTORE_OPTS[@]}"

      - name: Validate Release Outputs
        env:
          INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
        run: |
          set -euo pipefail
          test -s "./$INPUT_ECOSYSTEM/changelog.md" || {
            echo "::error::Missing or empty changelog.md"
            exit 1
          }
          compgen -G "./$INPUT_ECOSYSTEM/Output/*.apk" > /dev/null || {
            echo "::error::No APK output was produced"
            exit 1
          }

          APK_COUNT=$(find "./$INPUT_ECOSYSTEM/Output" -maxdepth 1 \
            -type f -name '*.apk' | wc -l)
          JSON_COUNT=$(find "./$INPUT_ECOSYSTEM/Output" -maxdepth 1 \
            -type f -name '*.json' | wc -l)
          LOG_COUNT=$(find "./$INPUT_ECOSYSTEM/Output" -maxdepth 1 \
            -type f -name '*.txt' | wc -l)

          printf '[INFO] Export summary: %s APK, %s JSON, %s TXT\n' \
            "$APK_COUNT" "$JSON_COUNT" "$LOG_COUNT"

          if [[ "$JSON_COUNT" -eq 0 && "$LOG_COUNT" -eq 0 ]]; then
            echo "::warning::No options.json or log exports were generated."
          fi

      - name: Publish to GitHub Releases
        if: inputs.upload_github_release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.release_tag_prefix }}-${{ github.run_id }}
          name: >-
            Patched Apps - ${{ inputs.release_tag_prefix }}
            (${{ github.run_id }})
          body_path: ./${{ inputs.ecosystem }}/changelog.md
          files: |
            ./${{ inputs.ecosystem }}/Output/*.apk
            ./${{ inputs.ecosystem }}/Output/*.json
            ./${{ inputs.ecosystem }}/Output/*.txt
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to HuggingFace Dataset
        if: inputs.upload_huggingface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
          ECOSYSTEM: ${{ inputs.ecosystem }}
        run: |
          set -euo pipefail
          python hf_upload.py

      - name: Send to Telegram Channel
        if: inputs.send_to_telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ECOSYSTEM: ${{ inputs.ecosystem }}
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            "kurigram" "TgCryptoRust"
          python tg_upload.py
