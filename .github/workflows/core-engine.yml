---
name: ⚙️ Core Patcher Engine

"on":
  workflow_call:
    inputs:
      ecosystem:
        required: true
        type: string
      apps:
        required: true
        type: string
      architecture:
        required: true
        type: string
      version_selection:
        required: true
        type: string
      custom_version:
        required: false
        type: string
        default: ''
      download_source:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      cli_track:
        required: true
        type: string
      custom_cli_version:
        required: false
        type: string
        default: ''
      patches_track:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      custom_patch_filename:
        required: true
        type: string
      upload_github_release:
        required: true
        type: boolean
      send_to_telegram:
        required: true
        type: boolean
      release_tag_prefix:
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # Serialize Telegram uploads globally (Pyrogram session is shared).
    # Non-Telegram runs use a per-ecosystem/tag prefix key.
    concurrency:
      group: >-
        ${{ inputs.send_to_telegram == true
            && 'telegram-session-lock'
            || format('build-{0}-{1}', inputs.ecosystem,
                      inputs.release_tag_prefix) }}
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize Java JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Python Environment
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Start FlareSolverr Microservice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FS_VERSION="$(
            gh api repos/FlareSolverr/FlareSolverr/releases/latest \
              --jq '.tag_name'
          )"
          if [[ -z "$FS_VERSION" ]]; then
            echo "::error::Failed to resolve FlareSolverr version"
            exit 1
          fi
          echo "Resolved FlareSolverr ${FS_VERSION}"

          docker run -d --name=flaresolverr \
            -p 127.0.0.1:8191:8191 \
            -e LOG_LEVEL=info \
            "ghcr.io/flaresolverr/flaresolverr:${FS_VERSION}"

          echo "Waiting for FlareSolverr to initialize..."
          timeout 30 bash -c '
            while ! curl -sf http://localhost:8191/ > /dev/null; do
              sleep 2
            done
          '
          echo "FlareSolverr proxy is online!"

      - name: Install Dependencies & apkeep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt

          APKEEP_VERSION='1.1.0'
          APKEEP_ASSET='apkeep-x86_64-unknown-linux-gnu'
          DL_BASE="https://github.com/EFForg/apkeep/releases/download"
          APKEEP_URL="${DL_BASE}/${APKEEP_VERSION}/${APKEEP_ASSET}"

          wget -q --show-progress --https-only "$APKEEP_URL" -O apkeep

          JQ_Q=".assets[] | select(.name == \"$APKEEP_ASSET\") | .digest"
          EXPECTED_SHA256="$(
            gh api "repos/EFForg/apkeep/releases/tags/$APKEEP_VERSION" \
              --jq "$JQ_Q" | sed 's/^sha256://'
          )"

          if [ -z "$EXPECTED_SHA256" ] || ! printf '%s  %s\n' \
            "$EXPECTED_SHA256" apkeep | sha256sum --check --status; then
            echo "::error::apkeep SHA-256 verification failed"
            rm -f apkeep
            exit 1
          fi

          chmod 0755 apkeep
          sudo install -m 0755 apkeep /usr/local/bin/apkeep
          rm -f apkeep

      - name: Fetch Environment Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CLI_TRACK: ${{ inputs.cli_track }}
          INPUT_CUSTOM_CLI_VERSION: ${{ inputs.custom_cli_version }}
          INPUT_PATCHES_TRACK: ${{ inputs.patches_track }}
          INPUT_REPO_URL: ${{ inputs.repo_url }}
          INPUT_CUSTOM_PATCH_FILENAME: ${{ inputs.custom_patch_filename }}
        run: |
          set -euo pipefail

          # Fetch CLI
          if [[ "$INPUT_CLI_TRACK" == "Custom" ]]; then
            CLI_TAG="$INPUT_CUSTOM_CLI_VERSION"
            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::Custom CLI version input is empty!"
              exit 1
            fi
            gh release download "$CLI_TAG" -R MorpheApp/morphe-desktop \
              --pattern "morphe-desktop-*-all.jar"
          elif [[ "$INPUT_CLI_TRACK" == "Pre-release" ]]; then
            JQ_FLTR='add | map(select(.prerelease==true and .draft==false))'
            JQ_FLTR="${JQ_FLTR} | .[].tag_name"
            CLI_TAG="$(gh api repos/MorpheApp/morphe-desktop/releases \
              --paginate | jq -r -s "$JQ_FLTR" | sort -V | tail -n 1)"
            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::No Morphe CLI pre-release was found"
              exit 1
            fi
            gh release download "$CLI_TAG" -R MorpheApp/morphe-desktop \
              --pattern "morphe-desktop-*-all.jar"
          else
            gh release download -R MorpheApp/morphe-desktop \
              --pattern "morphe-desktop-*-all.jar"
          fi

          mapfile -t JARS < <(find . -maxdepth 1 -type f \
            -name 'morphe-desktop-*-all.jar' -print | sort -V)
          if (( ${#JARS[@]} == 0 )); then
            echo "::error::Morphe CLI JAR was not downloaded"
            exit 1
          fi

          LATEST_JAR="${JARS[${#JARS[@]}-1]}"
          if [[ "$LATEST_JAR" != "./morphe.jar" && \
                "$LATEST_JAR" != "morphe.jar" ]]; then
            mv -- "$LATEST_JAR" morphe.jar
          fi

          # Fetch Patches
          TARGET_URL="https://github.com/$INPUT_REPO_URL"
          echo "TARGET_REPO_URL=$TARGET_URL" >> "$GITHUB_ENV"

          if [[ "$INPUT_PATCHES_TRACK" == "Custom Local" ]]; then
            test -f "Custom-Patches/$INPUT_CUSTOM_PATCH_FILENAME"
            cp -- "Custom-Patches/$INPUT_CUSTOM_PATCH_FILENAME" patches.mpp
            echo "PATCHES_VERSION=custom-local" >> "$GITHUB_ENV"

          elif [[ "$INPUT_PATCHES_TRACK" == "Pre-release" ]]; then
            JQ_FLTR='add | map(select(.prerelease==true and .draft==false))'
            JQ_FLTR="${JQ_FLTR} | .[].tag_name"
            PATCH_TAG="$(gh api "repos/$INPUT_REPO_URL/releases" \
              --paginate | jq -r -s "$JQ_FLTR" | sort -V | tail -n 1)"
            if [[ -z "$PATCH_TAG" ]]; then
              echo "::error::No patches pre-release found in $INPUT_REPO_URL"
              exit 1
            fi
            gh release download "$PATCH_TAG" -R "$INPUT_REPO_URL" \
              --pattern "*.mpp"
            mapfile -t MPPS < <(find . -maxdepth 1 -type f \
              -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle downloaded"
              exit 1
            fi
            LATEST_MPP="${MPPS[${#MPPS[@]}-1]}"
            if [[ "$LATEST_MPP" != "./patches.mpp" && \
                  "$LATEST_MPP" != "patches.mpp" ]]; then
              mv -- "$LATEST_MPP" patches.mpp
            fi
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"

          else
            PATCH_TAG="$(gh api "repos/$INPUT_REPO_URL/releases/latest" \
              | jq -r '.tag_name // empty')"
            if [[ -z "$PATCH_TAG" ]]; then
              echo "::error::No stable patches release found in $INPUT_REPO_URL"
              exit 1
            fi
            gh release download "$PATCH_TAG" -R "$INPUT_REPO_URL" \
              --pattern "*.mpp"
            mapfile -t MPPS < <(find . -maxdepth 1 -type f \
              -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle downloaded"
              exit 1
            fi
            LATEST_MPP="${MPPS[${#MPPS[@]}-1]}"
            if [[ "$LATEST_MPP" != "./patches.mpp" && \
                  "$LATEST_MPP" != "patches.mpp" ]]; then
              mv -- "$LATEST_MPP" patches.mpp
            fi
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"
          fi

      - name: Decode Custom Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > custom.keystore
          chmod 0600 custom.keystore

      - name: Evaluate Pre-release Flag
        env:
          INPUT_CLI_TRACK: ${{ inputs.cli_track }}
          INPUT_PATCHES_TRACK: ${{ inputs.patches_track }}
          INPUT_VERSION_SELECTION: ${{ inputs.version_selection }}
        run: |
          set -euo pipefail

          if [[ "$INPUT_CLI_TRACK" == "Pre-release" || \
                "$INPUT_PATCHES_TRACK" == "Pre-release" || \
                "$INPUT_PATCHES_TRACK" == "Custom Local" || \
                "$INPUT_VERSION_SELECTION" == "Beta" ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Execute Chihafuyu Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          HA_API_KEY: ${{ secrets.HA_API_KEY }}
          MD_API_KEY: ${{ secrets.MD_API_KEY }}
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          PLAY_AAS_TOKEN: ${{ secrets.PLAY_AAS_TOKEN }}
          DEVICE_PROPERTIES_B64: ${{ secrets.DEVICE_PROPERTIES_B64 }}
          INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
          INPUT_APPS: ${{ inputs.apps }}
          INPUT_ARCH: ${{ inputs.architecture }}
          INPUT_VERSION_SELECTION: ${{ inputs.version_selection }}
          INPUT_CUSTOM_VERSION: ${{ inputs.custom_version }}
          INPUT_DOWNLOAD_SOURCE: ${{ inputs.download_source }}
          INPUT_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INPUT_CLI_TRACK: ${{ inputs.cli_track }}
          INPUT_CUSTOM_CLI_VERSION: ${{ inputs.custom_cli_version }}
        run: |
          set -euo pipefail

          # Fetch real CLI version using GitHub CLI to avoid rate limits
          if [[ "$INPUT_CLI_TRACK" == "Stable" ]]; then
            R="repos/MorpheApp/morphe-desktop/releases/latest"
            REAL_CLI_TAG="$(gh api "$R" | jq -r '.tag_name // empty')"
          elif [[ "$INPUT_CLI_TRACK" == "Pre-release" ]]; then
            R="repos/MorpheApp/morphe-desktop/releases"
            JQ_F='map(select(.prerelease == true))'
            JQ_F="${JQ_F} | .[0].tag_name // empty"
            REAL_CLI_TAG="$(gh api "$R" | jq -r "$JQ_F")"
          else
            REAL_CLI_TAG="$INPUT_CUSTOM_CLI_VERSION"
          fi

          # Fallback if GitHub API fails or tag is empty
          if [[ -z "$REAL_CLI_TAG" || "$REAL_CLI_TAG" == "null" ]]; then
            REAL_CLI_TAG="$INPUT_CLI_TRACK"
          fi

          python -u main.py \
            --ecosystem "$INPUT_ECOSYSTEM" \
            --apps "$INPUT_APPS" \
            --arch "$INPUT_ARCH" \
            --version-selection "$INPUT_VERSION_SELECTION" \
            --custom-version "$INPUT_CUSTOM_VERSION" \
            --download-source "$INPUT_DOWNLOAD_SOURCE" \
            --continue-on-error "$INPUT_CONTINUE_ON_ERROR" \
            --cli "morphe.jar" \
            --cli-version "$REAL_CLI_TAG" \
            --patches "patches.mpp" \
            --patches-version "$PATCHES_VERSION" \
            --repo-url "$TARGET_REPO_URL" \
            --keystore "custom.keystore" \
            --ks-alias "$KEYSTORE_ALIAS" \
            --ks-pass "$KEYSTORE_PASSWORD" \
            --signer "$KEYSTORE_SIGNER_NAME" \
            --is-prerelease "$IS_PRERELEASE"

      - name: Validate Release Outputs
        env:
          INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
        run: |
          set -euo pipefail
          test -s "./$INPUT_ECOSYSTEM/changelog.md" || {
            echo "::error::Missing or empty changelog.md"
            exit 1
          }
          compgen -G "./$INPUT_ECOSYSTEM/Output/*.apk" > /dev/null || {
            echo "::error::No APK output was produced"
            exit 1
          }

      - name: Publish to GitHub Releases
        if: inputs.upload_github_release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.release_tag_prefix }}-${{ github.run_id }}
          name: >-
            Patched Apps - ${{ inputs.release_tag_prefix }}
            (${{ github.run_id }})
          body_path: ./${{ inputs.ecosystem }}/changelog.md
          files: ./${{ inputs.ecosystem }}/Output/*.apk
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to Telegram Channel
        if: inputs.send_to_telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ECOSYSTEM: ${{ inputs.ecosystem }}
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            "kurigram~=2.2" "TgrCrypto~=1.1"
          python tg_upload.py
