---
name: 🎮 Byehi98 Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_aliens_drive_me_crazy:
        description: 'Patch aliens-drive-me-crazy'
        required: true
        type: boolean
        default: false
      app_altos_adventure:
        description: 'Patch altos-adventure'
        required: true
        type: boolean
        default: false
      app_altos_odyssey:
        description: 'Patch altos-odyssey'
        required: true
        type: boolean
        default: false
      app_crossy_road:
        description: 'Patch crossy-road'
        required: true
        type: boolean
        default: false
      app_doodle_jump:
        description: 'Patch doodle-jump'
        required: true
        type: boolean
        default: false
      app_earn_to_die_2:
        description: 'Patch earn-to-die-2'
        required: true
        type: boolean
        default: false
      app_hill_climb_racing:
        description: 'Patch hill-climb-racing'
        required: true
        type: boolean
        default: false
      app_injustice_gods_among_us:
        description: 'Patch injustice-gods-among-us'
        required: true
        type: boolean
        default: false
      app_into_the_dead:
        description: 'Patch into-the-dead'
        required: true
        type: boolean
        default: false
      app_into_the_dead_2:
        description: 'Patch into-the-dead-2'
        required: true
        type: boolean
        default: false
      app_jetpack_joyride:
        description: 'Patch jetpack-joyride'
        required: true
        type: boolean
        default: false
      app_missiles:
        description: 'Patch missiles'
        required: true
        type: boolean
        default: false
      app_plague_inc:
        description: 'Patch plague-inc'
        required: true
        type: boolean
        default: false
      app_prince_of_persia_the_lost_crown:
        description: 'Patch prince-of-persia-the-lost-crown'
        required: true
        type: boolean
        default: false
      app_subway_surfers:
        description: 'Patch subway-surfers'
        required: true
        type: boolean
        default: false
      app_traffic_rider:
        description: 'Patch traffic-rider'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_ALIENS_DRIVE_ME_CRAZY: ${{ inputs.app_aliens_drive_me_crazy }}
      APP_ALTOS_ADVENTURE: ${{ inputs.app_altos_adventure }}
      APP_ALTOS_ODYSSEY: ${{ inputs.app_altos_odyssey }}
      APP_CROSSY_ROAD: ${{ inputs.app_crossy_road }}
      APP_DOODLE_JUMP: ${{ inputs.app_doodle_jump }}
      APP_EARN_TO_DIE_2: ${{ inputs.app_earn_to_die_2 }}
      APP_HILL_CLIMB_RACING: ${{ inputs.app_hill_climb_racing }}
      APP_INJUSTICE_GODS_AMONG_US: ${{ inputs.app_injustice_gods_among_us }}
      APP_INTO_THE_DEAD: ${{ inputs.app_into_the_dead }}
      APP_INTO_THE_DEAD_2: ${{ inputs.app_into_the_dead_2 }}
      APP_JETPACK_JOYRIDE: ${{ inputs.app_jetpack_joyride }}
      APP_MISSILES: ${{ inputs.app_missiles }}
      APP_PLAGUE_INC: ${{ inputs.app_plague_inc }}
      APP_PRINCE_OF_PERSIA: ${{ inputs.app_prince_of_persia_the_lost_crown }}
      APP_SUBWAY_SURFERS: ${{ inputs.app_subway_surfers }}
      APP_TRAFFIC_RIDER: ${{ inputs.app_traffic_rider }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_ALIENS_DRIVE_ME_CRAZY" == "true" ]]; then
            LIST="$LIST,aliens-drive-me-crazy"
          fi
          if [[ "$APP_ALTOS_ADVENTURE" == "true" ]]; then
            LIST="$LIST,altos-adventure"
          fi
          if [[ "$APP_ALTOS_ODYSSEY" == "true" ]]; then
            LIST="$LIST,altos-odyssey"
          fi
          if [[ "$APP_CROSSY_ROAD" == "true" ]]; then
            LIST="$LIST,crossy-road"
          fi
          if [[ "$APP_DOODLE_JUMP" == "true" ]]; then
            LIST="$LIST,doodle-jump"
          fi
          if [[ "$APP_EARN_TO_DIE_2" == "true" ]]; then
            LIST="$LIST,earn-to-die-2"
          fi
          if [[ "$APP_HILL_CLIMB_RACING" == "true" ]]; then
            LIST="$LIST,hill-climb-racing"
          fi
          if [[ "$APP_INJUSTICE_GODS_AMONG_US" == "true" ]]; then
            LIST="$LIST,injustice-gods-among-us"
          fi
          if [[ "$APP_INTO_THE_DEAD" == "true" ]]; then
            LIST="$LIST,into-the-dead"
          fi
          if [[ "$APP_INTO_THE_DEAD_2" == "true" ]]; then
            LIST="$LIST,into-the-dead-2"
          fi
          if [[ "$APP_JETPACK_JOYRIDE" == "true" ]]; then
            LIST="$LIST,jetpack-joyride"
          fi
          if [[ "$APP_MISSILES" == "true" ]]; then
            LIST="$LIST,missiles"
          fi
          if [[ "$APP_PLAGUE_INC" == "true" ]]; then
            LIST="$LIST,plague-inc"
          fi
          if [[ "$APP_PRINCE_OF_PERSIA" == "true" ]]; then
            LIST="$LIST,prince-of-persia-the-lost-crown"
          fi
          if [[ "$APP_SUBWAY_SURFERS" == "true" ]]; then
            LIST="$LIST,subway-surfers"
          fi
          if [[ "$APP_TRAFFIC_RIDER" == "true" ]]; then
            LIST="$LIST,traffic-rider"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "byehi98"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "byehi98/okish-morphe-patches"
      custom_patch_filename: "byehi98-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "byehi98"
