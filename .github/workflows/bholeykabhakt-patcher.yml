---
name: 🕉️ BholeyKaBhakt Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_speedtest:
        description: 'Patch speedtest'
        required: true
        type: boolean
        default: false
      app_stellarium:
        description: 'Patch stellarium'
        required: true
        type: boolean
        default: false
      app_proto:
        description: 'Patch proto'
        required: true
        type: boolean
        default: false
      app_vpnify:
        description: 'Patch vpnify'
        required: true
        type: boolean
        default: false
      app_backdrops:
        description: 'Patch backdrops'
        required: true
        type: boolean
        default: false
      app_solid_explorer:
        description: 'Patch solid-explorer'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_SPEEDTEST: ${{ inputs.app_speedtest }}
      APP_STELLARIUM: ${{ inputs.app_stellarium }}
      APP_PROTO: ${{ inputs.app_proto }}
      APP_VPNIFY: ${{ inputs.app_vpnify }}
      APP_BACKDROPS: ${{ inputs.app_backdrops }}
      APP_SOLID_EXPLORER: ${{ inputs.app_solid_explorer }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_SPEEDTEST" == "true" ]]; then
            LIST="$LIST,speedtest"
          fi
          if [[ "$APP_STELLARIUM" == "true" ]]; then
            LIST="$LIST,stellarium"
          fi
          if [[ "$APP_PROTO" == "true" ]]; then
            LIST="$LIST,proto"
          fi
          if [[ "$APP_VPNIFY" == "true" ]]; then
            LIST="$LIST,vpnify"
          fi
          if [[ "$APP_BACKDROPS" == "true" ]]; then
            LIST="$LIST,backdrops"
          fi
          if [[ "$APP_SOLID_EXPLORER" == "true" ]]; then
            LIST="$LIST,solid-explorer"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "BholeyKaBhakt"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "BholeyKaBhakt/android-patches-xtra"
      custom_patch_filename: "BholeyKaBhakt-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "BholeyKaBhakt"
