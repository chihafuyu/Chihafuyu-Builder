---
name: 🥷 MiguelNinja19 Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_anger_of_stick_5:
        description: 'Patch anger-of-stick-5'
        required: true
        type: boolean
        default: false
      app_duck_life_6_space:
        description: 'Patch duck-life-6-space'
        required: true
        type: boolean
        default: false
      app_hunter_assassin:
        description: 'Patch hunter-assassin'
        required: true
        type: boolean
        default: false
      app_lara_croft_guardian_of_light:
        description: 'Patch lara-croft-guardian-of-light'
        required: true
        type: boolean
        default: false
      app_plants_vs_zombies_free:
        description: 'Patch plants-vs-zombies-free'
        required: true
        type: boolean
        default: false
      app_supreme_duelist_stickman:
        description: 'Patch supreme-duelist-stickman'
        required: true
        type: boolean
        default: false
      app_the_battle_of_polytopia:
        description: 'Patch the-battle-of-polytopia'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom]
      custom_cli_version:
        description: 'Custom CLI Version (e.g. v1.16.0)'
        required: false
        default: ''
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_ANGER_OF_STICK_5: ${{ inputs.app_anger_of_stick_5 }}
      APP_DUCK_LIFE_6_SPACE: ${{ inputs.app_duck_life_6_space }}
      APP_HUNTER_ASSASSIN: ${{ inputs.app_hunter_assassin }}
      APP_LARA_CROFT: ${{ inputs.app_lara_croft_guardian_of_light }}
      APP_PVZ_FREE: ${{ inputs.app_plants_vs_zombies_free }}
      APP_SUPREME_DUELIST: ${{ inputs.app_supreme_duelist_stickman }}
      APP_BATTLE_POLYTOPIA: ${{ inputs.app_the_battle_of_polytopia }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_ANGER_OF_STICK_5" == "true" ]]; then
            LIST="$LIST,anger-of-stick-5"
          fi
          if [[ "$APP_DUCK_LIFE_6_SPACE" == "true" ]]; then
            LIST="$LIST,duck-life-6-space"
          fi
          if [[ "$APP_HUNTER_ASSASSIN" == "true" ]]; then
            LIST="$LIST,hunter-assassin"
          fi
          if [[ "$APP_LARA_CROFT" == "true" ]]; then
            LIST="$LIST,lara-croft-guardian-of-light"
          fi
          if [[ "$APP_PVZ_FREE" == "true" ]]; then
            LIST="$LIST,plants-vs-zombies-free"
          fi
          if [[ "$APP_SUPREME_DUELIST" == "true" ]]; then
            LIST="$LIST,supreme-duelist-stickman"
          fi
          if [[ "$APP_BATTLE_POLYTOPIA" == "true" ]]; then
            LIST="$LIST,the-battle-of-polytopia"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "MiguelNinja19"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "MiguelNinja19/miguel-morphe-patches"
      custom_patch_filename: "MiguelNinja19-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "MiguelNinja19"
