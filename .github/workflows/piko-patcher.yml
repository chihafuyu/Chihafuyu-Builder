---
name: 🦊 Piko Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_twitter_newx:
        description: 'Patch twitter-newx'
        required: true
        type: boolean
        default: true
      app_instagram:
        description: 'Patch instagram'
        required: true
        type: boolean
        default: true
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        type: string
        default: ''
      custom_version_code:
        description: 'Custom Version Code (blank for auto)'
        required: false
        type: string
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom]
      custom_cli_version:
        description: 'Custom CLI Version (e.g. v1.16.0)'
        required: false
        type: string
        default: ''
      patches_track:
        description: 'Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      upload_huggingface:
        description: 'Upload to HuggingFace Dataset'
        required: true
        type: boolean
        default: false
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      APP_TWITTER_NEWX: ${{ inputs.app_twitter_newx }}
      APP_INSTAGRAM: ${{ inputs.app_instagram }}
      PATCHES_TRACK: ${{ inputs.patches_track }}
    steps:
      - name: Generate Dynamic Matrix
        id: set-matrix
        run: |
          set -euo pipefail
          MATRIX_JSON="["
          PIKO_APPS=""

          if [[ "$APP_TWITTER_NEWX" == "true" ]]; then
            PIKO_APPS="twitter-newx"
          fi
          if [[ "$APP_INSTAGRAM" == "true" ]]; then
            if [[ -n "$PIKO_APPS" ]]; then
              PIKO_APPS="$PIKO_APPS,instagram"
            else
              PIKO_APPS="instagram"
            fi
          fi

          if [[ -n "$PIKO_APPS" ]]; then
            JSON_BLOCK='{"ecosystem": "piko", '
            JSON_BLOCK+='"repo": "crimera/piko", '
            JSON_BLOCK+='"apps": "'"$PIKO_APPS"'", '
            JSON_BLOCK+='"track": "'"$PATCHES_TRACK"'", '
            JSON_BLOCK+='"mpp_name": "piko-custom.mpp"},'
            MATRIX_JSON="${MATRIX_JSON}${JSON_BLOCK}"
          fi

          MATRIX_JSON="${MATRIX_JSON%,}]"

          if [[ "$MATRIX_JSON" == "[]" ]]; then
            echo "::error::No applications selected for patching!"
            exit 1
          fi

          {
            echo "matrix<<EOF"
            echo "$MATRIX_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-matrix
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.build_matrix) }}
    uses: ./.github/workflows/core-engine.yml
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      HA_API_KEY: ${{ secrets.HA_API_KEY }}
      MD_API_KEY: ${{ secrets.MD_API_KEY }}
      PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
      PLAY_AAS_TOKEN: ${{ secrets.PLAY_AAS_TOKEN }}
      DEVICE_PROPERTIES_B64: ${{ secrets.DEVICE_PROPERTIES_B64 }}
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      SESSION_STRING: ${{ secrets.SESSION_STRING }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
    with:
      ecosystem: ${{ matrix.ecosystem }}
      apps: ${{ matrix.apps }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      custom_version_code: ${{ inputs.custom_version_code }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ matrix.track }}
      repo_url: ${{ matrix.repo }}
      custom_patch_filename: ${{ matrix.mpp_name }}
      upload_github_release: ${{ inputs.upload_github_release }}
      upload_huggingface: ${{ inputs.upload_huggingface }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "piko"
