---
name: 🦊 Piko Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_x_twitter:
        description: 'Patch x-twitter'
        required: true
        type: boolean
        default: false
      app_newx_twitter:
        description: 'Patch newx-twitter'
        required: true
        type: boolean
        default: true
      app_instagram:
        description: 'Patch instagram'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom]
      custom_cli_version:
        description: 'Custom CLI Version (e.g. v1.16.0)'
        required: false
        default: ''
      reguler_patches_track:
        description: 'Reguler Patches Track (Twitter/IG)'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      newx_patches_track:
        description: 'NewX Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      APP_X_TWITTER: ${{ inputs.app_x_twitter }}
      APP_NEWX_TWITTER: ${{ inputs.app_newx_twitter }}
      APP_INSTAGRAM: ${{ inputs.app_instagram }}
      REGULER_TRACK: ${{ inputs.reguler_patches_track }}
      NEWX_TRACK: ${{ inputs.newx_patches_track }}
    steps:
      - name: Generate Dynamic Matrix
        id: set-matrix
        run: |
          set -euo pipefail
          MATRIX_JSON="["
          PIKO_APPS=""

          if [[ "$APP_X_TWITTER" == "true" ]]; then
            PIKO_APPS="x-twitter"
          fi
          if [[ "$APP_INSTAGRAM" == "true" ]]; then
            if [[ -n "$PIKO_APPS" ]]; then
              PIKO_APPS="$PIKO_APPS,instagram"
            else
              PIKO_APPS="instagram"
            fi
          fi

          if [[ -n "$PIKO_APPS" ]]; then
            JSON_BLOCK='{"target_name": "Reguler", "repo": "crimera/piko", '
            JSON_BLOCK+='"apps": "'"$PIKO_APPS"'", '
            JSON_BLOCK+='"track": "'"$REGULER_TRACK"'", '
            JSON_BLOCK+='"mpp_name": "piko-custom.mpp"},'
            MATRIX_JSON="${MATRIX_JSON}${JSON_BLOCK}"
          fi

          if [[ "$APP_NEWX_TWITTER" == "true" ]]; then
            JSON_BLOCK='{"target_name": "NewX", '
            JSON_BLOCK+='"repo": "crimera/piko-newx", '
            JSON_BLOCK+='"apps": "newx-twitter", '
            JSON_BLOCK+='"track": "'"$NEWX_TRACK"'", '
            JSON_BLOCK+='"mpp_name": "piko-newx.mpp"},'
            MATRIX_JSON="${MATRIX_JSON}${JSON_BLOCK}"
          fi

          MATRIX_JSON="${MATRIX_JSON%,}]"

          if [[ "$MATRIX_JSON" == "[]" ]]; then
            echo "::error::No applications selected for patching!"
            exit 1
          fi

          {
            echo "matrix<<EOF"
            echo "$MATRIX_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-matrix
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.build_matrix) }}
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "piko"
      apps: ${{ matrix.apps }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ matrix.track }}
      repo_url: ${{ matrix.repo }}
      custom_patch_filename: ${{ matrix.mpp_name }}
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "piko-${{ matrix.target_name }}"
