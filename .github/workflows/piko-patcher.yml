name: 🦊 Piko Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_x_twitter:
        description: 'Patch x-twitter'
        required: true
        type: boolean
        default: false
      app_newx_twitter:
        description: 'Patch newx-twitter'
        required: true
        type: boolean
        default: true
      app_instagram:
        description: 'Patch instagram'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options:
          - Latest Recommended
          - Beta
          - Custom
      custom_version:
        description: 'Custom App Version (Required if Custom is selected)'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
          - apkcombo
          - aptoide
          - uptodown
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
      reguler_patches_track:
        description: 'Reguler Patches Track (Twitter/IG)'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
          - Custom Local
      newx_patches_track:
        description: 'NewX Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
          - Custom Local
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Dynamic Matrix
        id: set-matrix
        run: |
          MATRIX_JSON="["
          PIKO_APPS=""
          
          if [[ "${{ inputs.app_x_twitter }}" == "true" ]]; then PIKO_APPS="x-twitter"; fi
          if [[ "${{ inputs.app_instagram }}" == "true" ]]; then
            if [[ -n "$PIKO_APPS" ]]; then PIKO_APPS="$PIKO_APPS,instagram"; else PIKO_APPS="instagram"; fi
          fi

          if [[ -n "$PIKO_APPS" ]]; then
            MATRIX_JSON="$MATRIX_JSON{\"target_name\": \"Reguler\", \"repo\": \"crimera/piko\", \"apps\": \"$PIKO_APPS\", \"track\": \"${{ inputs.reguler_patches_track }}\"},"
          fi

          if [[ "${{ inputs.app_newx_twitter }}" == "true" ]]; then
            MATRIX_JSON="$MATRIX_JSON{\"target_name\": \"NewX\", \"repo\": \"crimera/piko-newx\", \"apps\": \"newx-twitter\", \"track\": \"${{ inputs.newx_patches_track }}\"},"
          fi

          MATRIX_JSON="${MATRIX_JSON%,}]"

          if [[ "$MATRIX_JSON" == "[]" ]]; then
            echo "::error::No applications selected for patching!"
            exit 1
          fi

          echo "Generated Matrix: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  execute-patching:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.build_matrix) }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize Java JDK 25
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Initialize Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Dependencies & apkeep
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          APKEEP_VERSION='1.0.0'
          APKEEP_ASSET='apkeep-x86_64-unknown-linux-gnu'
          APKEEP_URL="https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/${APKEEP_ASSET}"

          wget -q --show-progress --https-only "$APKEEP_URL" -O apkeep

          EXPECTED_SHA256="$(
            gh api "repos/EFForg/apkeep/releases/tags/${APKEEP_VERSION}" \
              --jq '.assets[] | select(.name == "'"$APKEEP_ASSET"'") | .digest' \
              | sed 's/^sha256://'
          )"

          if [ -z "$EXPECTED_SHA256" ] || ! printf '%s  %s\n' "$EXPECTED_SHA256" apkeep | sha256sum --check --status; then
            echo "::error::apkeep SHA-256 verification failed"
            rm -f apkeep
            exit 1
          fi

          chmod 0755 apkeep
          sudo install -m 0755 apkeep /usr/local/bin/apkeep
          rm -f apkeep
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch Environment Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TRACK: ${{ inputs.cli_track }}
          PATCHES_TRACK: ${{ matrix.track }}
          REPO_URL: ${{ matrix.repo }}
        run: |
          set -euo pipefail

          if [[ "$CLI_TRACK" == "Pre-release" ]]; then
            CLI_TAG="$(gh api repos/MorpheApp/morphe-desktop/releases --paginate | jq -r -s 'add | map(select(.prerelease == true and .draft == false))[0].tag_name // empty')"
            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::No Morphe CLI pre-release was found"
              exit 1
            fi
            gh release download "$CLI_TAG" -R MorpheApp/morphe-desktop --pattern "morphe-desktop-*-all.jar"
          else
            gh release download -R MorpheApp/morphe-desktop --pattern "morphe-desktop-*-all.jar"
          fi

          mapfile -t JARS < <(find . -maxdepth 1 -type f -name 'morphe-desktop-*-all.jar' -print | sort -V)
          if (( ${#JARS[@]} == 0 )); then
            echo "::error::Morphe CLI JAR was not downloaded"
            exit 1
          fi
          LATEST_JAR="${JARS[${#JARS[@]}-1]}"
          
          if [[ "$LATEST_JAR" != "./morphe.jar" && "$LATEST_JAR" != "morphe.jar" ]]; then
            mv -- "$LATEST_JAR" morphe.jar
          fi

          echo "TARGET_REPO_URL=https://github.com/$REPO_URL" >> "$GITHUB_ENV"

          if [[ "$PATCHES_TRACK" == "Custom Local" ]]; then
            if [[ "$REPO_URL" == "crimera/piko-newx" ]]; then
              test -f "Custom-Patches/piko-newx.mpp"
              cp -- "Custom-Patches/piko-newx.mpp" patches.mpp
              echo "PATCHES_VERSION=custom-local-newx" >> "$GITHUB_ENV"
            else
              test -f "Custom-Patches/piko-custom.mpp"
              cp -- "Custom-Patches/piko-custom.mpp" patches.mpp
              echo "PATCHES_VERSION=custom-local-regular" >> "$GITHUB_ENV"
            fi
          elif [[ "$PATCHES_TRACK" == "Pre-release" ]]; then
            PATCH_TAG="$(gh api "repos/$REPO_URL/releases" --paginate | jq -r -s 'add | map(select(.prerelease == true and .draft == false))[0].tag_name // empty')"
            if [[ -z "$PATCH_TAG" ]]; then
              echo "::error::No patches pre-release was found in $REPO_URL"
              exit 1
            fi
            gh release download "$PATCH_TAG" -R "$REPO_URL" --pattern "*.mpp"
            mapfile -t MPPS < <(find . -maxdepth 1 -type f -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle was downloaded"
              exit 1
            fi
            LATEST_MPP="${MPPS[${#MPPS[@]}-1]}"
            
            if [[ "$LATEST_MPP" != "./patches.mpp" && "$LATEST_MPP" != "patches.mpp" ]]; then
              mv -- "$LATEST_MPP" patches.mpp
            fi
            
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"
          else
            PATCH_TAG="$(gh api "repos/$REPO_URL/releases/latest" | jq -r '.tag_name // empty')"
            if [[ -z "$PATCH_TAG" ]]; then
              echo "::error::No stable patches release was found in $REPO_URL"
              exit 1
            fi
            gh release download "$PATCH_TAG" -R "$REPO_URL" --pattern "*.mpp"
            mapfile -t MPPS < <(find . -maxdepth 1 -type f -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle was downloaded"
              exit 1
            fi
            LATEST_MPP="${MPPS[${#MPPS[@]}-1]}"
            
            if [[ "$LATEST_MPP" != "./patches.mpp" && "$LATEST_MPP" != "patches.mpp" ]]; then
              mv -- "$LATEST_MPP" patches.mpp
            fi
            
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"
          fi

      - name: Decode Custom Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > custom.keystore
          chmod 0600 custom.keystore

      - name: Evaluate Pre-release Flag
        run: |
          if [[ "${{ inputs.cli_track }}" == "Pre-release" || "${{ matrix.track }}" == "Pre-release" || "${{ matrix.track }}" == "Custom Local" || "${{ inputs.version_selection }}" == "Beta" ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Execute Chihafuyu Builder
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          HA_API_KEY: ${{ secrets.HA_API_KEY }}
          MD_API_KEY: ${{ secrets.MD_API_KEY }}
          SELECTED_APPS: ${{ matrix.apps }}
          ARCHITECTURE: ${{ inputs.architecture }}
          VERSION_SELECTION: ${{ inputs.version_selection }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          DOWNLOAD_SOURCE: ${{ inputs.download_source }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          PLAY_AAS_TOKEN: ${{ secrets.PLAY_AAS_TOKEN }}
          DEVICE_PROPERTIES_B64: ${{ secrets.DEVICE_PROPERTIES_B64 }}
        run: |
          set -euo pipefail

          python -u main.py \
            --ecosystem "piko" \
            --apps "$SELECTED_APPS" \
            --arch "$ARCHITECTURE" \
            --version-selection "$VERSION_SELECTION" \
            --custom-version "$CUSTOM_VERSION" \
            --download-source "$DOWNLOAD_SOURCE" \
            --continue-on-error "$CONTINUE_ON_ERROR" \
            --cli "morphe.jar" \
            --patches "patches.mpp" \
            --patches-version "$PATCHES_VERSION" \
            --repo-url "$TARGET_REPO_URL" \
            --keystore "custom.keystore" \
            --ks-alias "$KEYSTORE_ALIAS" \
            --ks-pass "$KEYSTORE_PASSWORD" \
            --signer "$KEYSTORE_SIGNER_NAME" \
            --is-prerelease "${{ env.IS_PRERELEASE }}"

      - name: Validate Release Outputs
        run: |
          set -euo pipefail

          test -s "./piko/changelog.md" || {
            echo "::error::Missing or empty changelog.md"
            exit 1
          }

          compgen -G "./piko/Output/*.apk" > /dev/null || {
            echo "::error::No APK output was produced"
            exit 1
          }

      - name: Set Release Tag
        if: inputs.upload_github_release
        run: echo "DATE_TAG=$(date -u +'%Y.%m.%d-%H%M%S')-${{ matrix.target_name }}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Publish to GitHub Releases
        if: inputs.upload_github_release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: piko-${{ env.DATE_TAG }}
          name: Patched Apps - Piko ${{ matrix.target_name }} (${{ env.DATE_TAG }})
          body_path: ./piko/changelog.md
          files: ./piko/Output/*.apk
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Send to Telegram Channel
        if: inputs.send_to_telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ECOSYSTEM: "piko"
        run: |
          set -euo pipefail

          python -m pip install kurigram tgcrypto
          python tg_upload.py
