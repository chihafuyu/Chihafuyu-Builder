name: 🦊 Piko Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_x_twitter:
        description: 'Patch x-twitter'
        required: true
        type: boolean
        default: false
      app_newx_twitter:
        description: 'Patch newx-twitter'
        required: true
        type: boolean
        default: true
      app_instagram:
        description: 'Patch instagram'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options: [default, google_play, huggingface, archive, apkmirror, apkpure, apkcombo, aptoide, uptodown]
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      reguler_patches_track:
        description: 'Reguler Patches Track (Twitter/IG)'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      newx_patches_track:
        description: 'NewX Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Dynamic Matrix
        id: set-matrix
        run: |
          MATRIX_JSON="["
          PIKO_APPS=""
          
          if [[ "${{ inputs.app_x_twitter }}" == "true" ]]; then PIKO_APPS="x-twitter"; fi
          if [[ "${{ inputs.app_instagram }}" == "true" ]]; then
            if [[ -n "$PIKO_APPS" ]]; then PIKO_APPS="$PIKO_APPS,instagram"; else PIKO_APPS="instagram"; fi
          fi

          if [[ -n "$PIKO_APPS" ]]; then
            MATRIX_JSON="$MATRIX_JSON{\"target_name\": \"Reguler\", \"repo\": \"crimera/piko\", \"apps\": \"$PIKO_APPS\", \"track\": \"${{ inputs.reguler_patches_track }}\", \"mpp_name\": \"piko-custom.mpp\"},"
          fi

          if [[ "${{ inputs.app_newx_twitter }}" == "true" ]]; then
            MATRIX_JSON="$MATRIX_JSON{\"target_name\": \"NewX\", \"repo\": \"crimera/piko-newx\", \"apps\": \"newx-twitter\", \"track\": \"${{ inputs.newx_patches_track }}\", \"mpp_name\": \"piko-newx.mpp\"},"
          fi

          MATRIX_JSON="${MATRIX_JSON%,}]"

          if [[ "$MATRIX_JSON" == "[]" ]]; then
            echo "::error::No applications selected for patching!"
            exit 1
          fi

          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.build_matrix) }}
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "piko"
      apps: ${{ matrix.apps }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ matrix.track }}
      repo_url: ${{ matrix.repo }}
      custom_patch_filename: ${{ matrix.mpp_name }}
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "piko-${{ matrix.target_name }}"
