---
name: 🔥 Hxreborn Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_1weather:
        description: 'Patch 1weather'
        required: true
        type: boolean
        default: false
      app_all_in_one_calculator:
        description: 'Patch all-in-one-calculator'
        required: true
        type: boolean
        default: false
      app_alpinequest:
        description: 'Patch alpinequest'
        required: true
        type: boolean
        default: false
      app_bettersleep:
        description: 'Patch bettersleep'
        required: true
        type: boolean
        default: false
      app_cx_file_explorer:
        description: 'Patch cx-file-explorer'
        required: true
        type: boolean
        default: false
      app_dwg_fastview:
        description: 'Patch dwg-fastview'
        required: true
        type: boolean
        default: false
      app_notesnook:
        description: 'Patch notesnook'
        required: true
        type: boolean
        default: false
      app_photo_editor_pro:
        description: 'Patch photo-editor-pro'
        required: true
        type: boolean
        default: false
      app_projectivy_launcher:
        description: 'Patch projectivy-launcher'
        required: true
        type: boolean
        default: false
      app_proton_mail:
        description: 'Patch proton-mail'
        required: true
        type: boolean
        default: false
      app_quranify:
        description: 'Patch quranify'
        required: true
        type: boolean
        default: false
      app_readera:
        description: 'Patch readera'
        required: true
        type: boolean
        default: false
      app_ringtone_maker:
        description: 'Patch ringtone-maker'
        required: true
        type: boolean
        default: false
      app_rise_sleep_tracker:
        description: 'Patch rise-sleep-tracker'
        required: true
        type: boolean
        default: false
      app_symfonium:
        description: 'Patch symfonium'
        required: true
        type: boolean
        default: false
      app_vpnify:
        description: 'Patch vpnify'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_1WEATHER: ${{ inputs.app_1weather }}
      APP_ALL_IN_ONE_CALCULATOR: ${{ inputs.app_all_in_one_calculator }}
      APP_ALPINEQUEST: ${{ inputs.app_alpinequest }}
      APP_BETTERSLEEP: ${{ inputs.app_bettersleep }}
      APP_CX_FILE_EXPLORER: ${{ inputs.app_cx_file_explorer }}
      APP_DWG_FASTVIEW: ${{ inputs.app_dwg_fastview }}
      APP_NOTESNOOK: ${{ inputs.app_notesnook }}
      APP_PHOTO_EDITOR_PRO: ${{ inputs.app_photo_editor_pro }}
      APP_PROJECTIVY_LAUNCHER: ${{ inputs.app_projectivy_launcher }}
      APP_PROTON_MAIL: ${{ inputs.app_proton_mail }}
      APP_QURANIFY: ${{ inputs.app_quranify }}
      APP_READERA: ${{ inputs.app_readera }}
      APP_RINGTONE_MAKER: ${{ inputs.app_ringtone_maker }}
      APP_RISE_SLEEP_TRACKER: ${{ inputs.app_rise_sleep_tracker }}
      APP_SYMFONIUM: ${{ inputs.app_symfonium }}
      APP_VPNIFY: ${{ inputs.app_vpnify }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_1WEATHER" == "true" ]]; then
            LIST="$LIST,1weather"
          fi
          if [[ "$APP_ALL_IN_ONE_CALCULATOR" == "true" ]]; then
            LIST="$LIST,all-in-one-calculator"
          fi
          if [[ "$APP_ALPINEQUEST" == "true" ]]; then
            LIST="$LIST,alpinequest"
          fi
          if [[ "$APP_BETTERSLEEP" == "true" ]]; then
            LIST="$LIST,bettersleep"
          fi
          if [[ "$APP_CX_FILE_EXPLORER" == "true" ]]; then
            LIST="$LIST,cx-file-explorer"
          fi
          if [[ "$APP_DWG_FASTVIEW" == "true" ]]; then
            LIST="$LIST,dwg-fastview"
          fi
          if [[ "$APP_NOTESNOOK" == "true" ]]; then
            LIST="$LIST,notesnook"
          fi
          if [[ "$APP_PHOTO_EDITOR_PRO" == "true" ]]; then
            LIST="$LIST,photo-editor-pro"
          fi
          if [[ "$APP_PROJECTIVY_LAUNCHER" == "true" ]]; then
            LIST="$LIST,projectivy-launcher"
          fi
          if [[ "$APP_PROTON_MAIL" == "true" ]]; then
            LIST="$LIST,proton-mail"
          fi
          if [[ "$APP_QURANIFY" == "true" ]]; then
            LIST="$LIST,quranify"
          fi
          if [[ "$APP_READERA" == "true" ]]; then
            LIST="$LIST,readera"
          fi
          if [[ "$APP_RINGTONE_MAKER" == "true" ]]; then
            LIST="$LIST,ringtone-maker"
          fi
          if [[ "$APP_RISE_SLEEP_TRACKER" == "true" ]]; then
            LIST="$LIST,rise-sleep-tracker"
          fi
          if [[ "$APP_SYMFONIUM" == "true" ]]; then
            LIST="$LIST,symfonium"
          fi
          if [[ "$APP_VPNIFY" == "true" ]]; then
            LIST="$LIST,vpnify"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "hxreborn"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "hxreborn/morphe-patches"
      custom_patch_filename: "hxreborn-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "hxreborn"
