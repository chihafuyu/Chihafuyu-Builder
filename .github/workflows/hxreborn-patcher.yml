name: 🔥 Hxreborn Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_1weather:
        description: 'Patch 1weather'
        required: true
        type: boolean
        default: false
      app_all_in_one_calculator:
        description: 'Patch all-in-one-calculator'
        required: true
        type: boolean
        default: false
      app_alpinequest:
        description: 'Patch alpinequest'
        required: true
        type: boolean
        default: false
      app_bettersleep:
        description: 'Patch bettersleep'
        required: true
        type: boolean
        default: false
      app_cx_file_explorer:
        description: 'Patch cx-file-explorer'
        required: true
        type: boolean
        default: false
      app_dwg_fastview:
        description: 'Patch dwg-fastview'
        required: true
        type: boolean
        default: false
      app_moviebox:
        description: 'Patch moviebox'
        required: true
        type: boolean
        default: false
      app_photo_editor_pro:
        description: 'Patch photo-editor-pro'
        required: true
        type: boolean
        default: false
      app_projectivy_launcher:
        description: 'Patch projectivy-launcher'
        required: true
        type: boolean
        default: false
      app_proton_mail:
        description: 'Patch proton-mail'
        required: true
        type: boolean
        default: false
      app_quranify:
        description: 'Patch quranify'
        required: true
        type: boolean
        default: false
      app_readera:
        description: 'Patch readera'
        required: true
        type: boolean
        default: false
      app_rise_sleep_tracker:
        description: 'Patch rise-sleep-tracker'
        required: true
        type: boolean
        default: false
      app_symfonium:
        description: 'Patch symfonium'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options: [default, google_play, huggingface, archive, apkmirror, apkpure, apkcombo, aptoide, uptodown]
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: true

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    steps:
      - id: build-list
        run: |
          LIST=""
          if [[ "${{ inputs.app_1weather }}" == "true" ]]; then LIST="$LIST,1weather"; fi
          if [[ "${{ inputs.app_all_in_one_calculator }}" == "true" ]]; then LIST="$LIST,all-in-one-calculator"; fi
          if [[ "${{ inputs.app_alpinequest }}" == "true" ]]; then LIST="$LIST,alpinequest"; fi
          if [[ "${{ inputs.app_bettersleep }}" == "true" ]]; then LIST="$LIST,bettersleep"; fi
          if [[ "${{ inputs.app_cx_file_explorer }}" == "true" ]]; then LIST="$LIST,cx-file-explorer"; fi
          if [[ "${{ inputs.app_dwg_fastview }}" == "true" ]]; then LIST="$LIST,dwg-fastview"; fi
          if [[ "${{ inputs.app_moviebox }}" == "true" ]]; then LIST="$LIST,moviebox"; fi
          if [[ "${{ inputs.app_photo_editor_pro }}" == "true" ]]; then LIST="$LIST,photo-editor-pro"; fi
          if [[ "${{ inputs.app_projectivy_launcher }}" == "true" ]]; then LIST="$LIST,projectivy-launcher"; fi
          if [[ "${{ inputs.app_proton_mail }}" == "true" ]]; then LIST="$LIST,proton-mail"; fi
          if [[ "${{ inputs.app_quranify }}" == "true" ]]; then LIST="$LIST,quranify"; fi
          if [[ "${{ inputs.app_readera }}" == "true" ]]; then LIST="$LIST,readera"; fi
          if [[ "${{ inputs.app_rise_sleep_tracker }}" == "true" ]]; then LIST="$LIST,rise-sleep-tracker"; fi
          if [[ "${{ inputs.app_symfonium }}" == "true" ]]; then LIST="$LIST,symfonium"; fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then echo "::error::No applications selected!"; exit 1; fi
          echo "apps=$LIST" >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "hxreborn"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "hxreborn/morphe-patches"
      custom_patch_filename: "hxreborn-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "hxreborn"
