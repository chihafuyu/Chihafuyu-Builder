name: 🧑‍ Arandomhooman Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_adm:
        description: 'Patch adm'
        required: true
        type: boolean
        default: false
      app_alpha_progression:
        description: 'Patch alpha-progression'
        required: true
        type: boolean
        default: false
      app_bandlab:
        description: 'Patch bandlab'
        required: true
        type: boolean
        default: false
      app_battery_guru:
        description: 'Patch battery-guru'
        required: true
        type: boolean
        default: false
      app_cronometer:
        description: 'Patch cronometer'
        required: true
        type: boolean
        default: false
      app_directchat:
        description: 'Patch directchat'
        required: true
        type: boolean
        default: false
      app_finch:
        description: 'Patch finch'
        required: true
        type: boolean
        default: false
      app_flightradar24:
        description: 'Patch flightradar24'
        required: true
        type: boolean
        default: false
      app_foldersync:
        description: 'Patch foldersync'
        required: true
        type: boolean
        default: false
      app_inshot:
        description: 'Patch inshot'
        required: true
        type: boolean
        default: false
      app_liquid_gallery:
        description: 'Patch liquid-gallery'
        required: true
        type: boolean
        default: false
      app_poweramp:
        description: 'Patch poweramp'
        required: true
        type: boolean
        default: false
      app_smart_audiobook:
        description: 'Patch smart-audiobook'
        required: true
        type: boolean
        default: false
      app_symfonium:
        description: 'Patch symfonium'
        required: true
        type: boolean
        default: false
      app_tumblr:
        description: 'Patch tumblr'
        required: true
        type: boolean
        default: false
      app_video_converter:
        description: 'Patch video-converter'
        required: true
        type: boolean
        default: false
      app_webtoon:
        description: 'Patch webtoon'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options:
          - Latest Recommended
          - Beta
          - Custom
      custom_version:
        description: 'Custom App Version (Required if Custom is selected)'
        required: false
        default: ''
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
          - Custom Local

jobs:
  execute-patching:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize Java JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          
      - name: Initialize Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Dependencies & apkeep
        run: |
          pip install -r requirements.txt
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu -O apkeep
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/

      - name: Fetch Environment Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.cli_track }}" == "Pre-release" ]; then
            CLI_TAG=$(gh api repos/MorpheApp/morphe-desktop/releases | jq -r '.[0].tag_name')
            gh release download "$CLI_TAG" -R MorpheApp/morphe-desktop --pattern "morphe-desktop-*-all.jar"
          else
            gh release download -R MorpheApp/morphe-desktop --pattern "morphe-desktop-*-all.jar"
          fi
          mv morphe-desktop-*-all.jar morphe.jar
          
          REPO_URL="arandomhooman/hoomans-morphe-patches"
          echo "TARGET_REPO_URL=https://github.com/$REPO_URL" >> $GITHUB_ENV
          
          if [ "${{ github.event.inputs.patches_track }}" == "Custom Local" ]; then
            cp "Custom-Patches/arandomhooman-custom.mpp" patches.mpp
            echo "PATCHES_VERSION=custom-local" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.patches_track }}" == "Pre-release" ]; then
            PATCH_TAG=$(gh api repos/$REPO_URL/releases | jq -r '.[0].tag_name')
            gh release download "$PATCH_TAG" -R $REPO_URL --pattern "*.mpp"
            mv *.mpp patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> $GITHUB_ENV
          else
            PATCH_TAG=$(gh api repos/$REPO_URL/releases/latest | jq -r '.tag_name')
            gh release download "$PATCH_TAG" -R $REPO_URL --pattern "*.mpp"
            mv *.mpp patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> $GITHUB_ENV
          fi

      - name: Decode Custom Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > custom.keystore

      # --- CHECKBOX COMBINER ENGINE ---
      - name: Prepare App Selection
        id: prep_apps
        run: |
          APP_LIST=""
          if [ "${{ github.event.inputs.app_adm }}" == "true" ]; then APP_LIST="$APP_LIST,adm"; fi
          if [ "${{ github.event.inputs.app_alpha_progression }}" == "true" ]; then APP_LIST="$APP_LIST,alpha-progression"; fi
          if [ "${{ github.event.inputs.app_bandlab }}" == "true" ]; then APP_LIST="$APP_LIST,bandlab"; fi
          if [ "${{ github.event.inputs.app_battery_guru }}" == "true" ]; then APP_LIST="$APP_LIST,battery-guru"; fi
          if [ "${{ github.event.inputs.app_cronometer }}" == "true" ]; then APP_LIST="$APP_LIST,cronometer"; fi
          if [ "${{ github.event.inputs.app_directchat }}" == "true" ]; then APP_LIST="$APP_LIST,directchat"; fi
          if [ "${{ github.event.inputs.app_finch }}" == "true" ]; then APP_LIST="$APP_LIST,finch"; fi
          if [ "${{ github.event.inputs.app_flightradar24 }}" == "true" ]; then APP_LIST="$APP_LIST,flightradar24"; fi
          if [ "${{ github.event.inputs.app_foldersync }}" == "true" ]; then APP_LIST="$APP_LIST,foldersync"; fi
          if [ "${{ github.event.inputs.app_inshot }}" == "true" ]; then APP_LIST="$APP_LIST,inshot"; fi
          if [ "${{ github.event.inputs.app_liquid_gallery }}" == "true" ]; then APP_LIST="$APP_LIST,liquid-gallery"; fi
          if [ "${{ github.event.inputs.app_poweramp }}" == "true" ]; then APP_LIST="$APP_LIST,poweramp"; fi
          if [ "${{ github.event.inputs.app_smart_audiobook }}" == "true" ]; then APP_LIST="$APP_LIST,smart-audiobook"; fi
          if [ "${{ github.event.inputs.app_symfonium }}" == "true" ]; then APP_LIST="$APP_LIST,symfonium"; fi
          if [ "${{ github.event.inputs.app_tumblr }}" == "true" ]; then APP_LIST="$APP_LIST,tumblr"; fi
          if [ "${{ github.event.inputs.app_video_converter }}" == "true" ]; then APP_LIST="$APP_LIST,video-converter"; fi
          if [ "${{ github.event.inputs.app_webtoon }}" == "true" ]; then APP_LIST="$APP_LIST,webtoon"; fi
          
          # Remove leading comma (if any)
          APP_LIST=${APP_LIST#,}
          
          # Prevent error if no application is selected
          if [ -z "$APP_LIST" ]; then
            echo "::error::No applications selected for patching!"
            exit 1
          fi
          
          echo "SELECTED_APPS=$APP_LIST" >> $GITHUB_ENV
          echo "Ready to patch: $APP_LIST"

      - name: Execute Chihafuyu Tool
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
        run: |
          python -u chihafuyu_tool.py \
            --ecosystem "arandomhooman" \
            --apps "${{ env.SELECTED_APPS }}" \
            --arch "${{ github.event.inputs.architecture }}" \
            --version-selection "${{ github.event.inputs.version_selection }}" \
            --custom-version "${{ github.event.inputs.custom_version }}" \
            --cli "morphe.jar" \
            --patches "patches.mpp" \
            --patches-version "${{ env.PATCHES_VERSION }}" \
            --repo-url "${{ env.TARGET_REPO_URL }}" \
            --keystore "custom.keystore" \
            --ks-alias "$KEYSTORE_ALIAS" \
            --ks-pass "$KEYSTORE_PASSWORD" \
            --signer "$KEYSTORE_SIGNER_NAME"

      - name: Set Release Tag
        id: vars
        run: echo "DATE_TAG=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: arandomhooman-${{ env.DATE_TAG }}
          name: Patched Apps - arandomhooman (${{ env.DATE_TAG }})
          body_path: ./arandomhooman/changelog.md
          files: ./arandomhooman/Output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
