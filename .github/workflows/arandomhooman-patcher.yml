name: 🧑‍ Arandomhooman Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_adm:
        description: 'Patch adm'
        required: true
        type: boolean
        default: false
      app_alpha_progression:
        description: 'Patch alpha-progression'
        required: true
        type: boolean
        default: false
      app_bandlab:
        description: 'Patch bandlab'
        required: true
        type: boolean
        default: false
      app_battery_guru:
        description: 'Patch battery-guru'
        required: true
        type: boolean
        default: false
      app_cronometer:
        description: 'Patch cronometer'
        required: true
        type: boolean
        default: false
      app_directchat:
        description: 'Patch directchat'
        required: true
        type: boolean
        default: false
      app_finch:
        description: 'Patch finch'
        required: true
        type: boolean
        default: false
      app_flightradar24:
        description: 'Patch flightradar24'
        required: true
        type: boolean
        default: false
      app_foldersync:
        description: 'Patch foldersync'
        required: true
        type: boolean
        default: false
      app_inshot:
        description: 'Patch inshot'
        required: true
        type: boolean
        default: false
      app_liquid_gallery:
        description: 'Patch liquid-gallery'
        required: true
        type: boolean
        default: false
      app_poweramp:
        description: 'Patch poweramp'
        required: true
        type: boolean
        default: false
      app_smart_audiobook:
        description: 'Patch smart-audiobook'
        required: true
        type: boolean
        default: false
      app_symfonium:
        description: 'Patch symfonium'
        required: true
        type: boolean
        default: false
      app_tumblr:
        description: 'Patch tumblr'
        required: true
        type: boolean
        default: false
      app_video_converter:
        description: 'Patch video-converter'
        required: true
        type: boolean
        default: false
      app_webtoon:
        description: 'Patch webtoon'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options:
          - Latest Recommended
          - Beta
          - Custom
      custom_version:
        description: 'Custom App Version (Required if Custom is selected)'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - huggingface
          - archive
          - apkmirror
          - apkpure
          - apkcombo
          - aptoide
          - uptodown
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options:
          - Stable
          - Pre-release
          - Custom Local

jobs:
  execute-patching:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize Java JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Initialize Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies & apkeep
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          APKEEP_VERSION='1.0.0'
          APKEEP_ASSET='apkeep-x86_64-unknown-linux-gnu'
          APKEEP_URL="https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/${APKEEP_ASSET}"

          wget -q --show-progress --https-only "$APKEEP_URL" -O apkeep

          EXPECTED_SHA256="$(
            gh api "repos/EFForg/apkeep/releases/tags/${APKEEP_VERSION}" \
              --jq '.assets[] | select(.name == "'"$APKEEP_ASSET"'") | .digest' \
              | sed 's/^sha256://'
          )"

          if [ -z "$EXPECTED_SHA256" ] || ! printf '%s  %s\n' "$EXPECTED_SHA256" apkeep | sha256sum --check --status; then
            echo "::error::apkeep SHA-256 verification failed"
            rm -f apkeep
            exit 1
          fi

          chmod 0755 apkeep
          sudo install -m 0755 apkeep /usr/local/bin/apkeep
          rm -f apkeep
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch Environment Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TRACK: ${{ inputs.cli_track }}
          PATCHES_TRACK: ${{ inputs.patches_track }}
        run: |
          set -euo pipefail

          if [[ "$CLI_TRACK" == "Pre-release" ]]; then
            CLI_TAG="$(gh api repos/MorpheApp/morphe-desktop/releases --paginate | jq -r -s 'add | map(select(.prerelease == true and .draft == false))[0].tag_name // empty')"

            if [[ -z "$CLI_TAG" ]]; then
              echo "::error::No Morphe CLI pre-release was found"
              exit 1
            fi

            gh release download "$CLI_TAG" \
              -R MorpheApp/morphe-desktop \
              --pattern "morphe-desktop-*-all.jar"
          else
            gh release download \
              -R MorpheApp/morphe-desktop \
              --pattern "morphe-desktop-*-all.jar"
          fi

          mapfile -t JARS < <(find . -maxdepth 1 -type f -name 'morphe-desktop-*-all.jar' -print | sort -V)
          if (( ${#JARS[@]} == 0 )); then
            echo "::error::Morphe CLI JAR was not downloaded"
            exit 1
          fi

          LATEST_JAR="${JARS[${#JARS[@]}-1]}"
          mv -- "$LATEST_JAR" morphe.jar

          REPO_URL="arandomhooman/hoomans-morphe-patches"
          echo "TARGET_REPO_URL=https://github.com/$REPO_URL" >> "$GITHUB_ENV"

          if [[ "$PATCHES_TRACK" == "Custom Local" ]]; then
            test -f "Custom-Patches/arandomhooman-custom.mpp"
            cp -- "Custom-Patches/arandomhooman-custom.mpp" patches.mpp
            echo "PATCHES_VERSION=custom-local" >> "$GITHUB_ENV"
          elif [[ "$PATCHES_TRACK" == "Pre-release" ]]; then
            PATCH_TAG="$(gh api "repos/$REPO_URL/releases" --paginate | jq -r -s 'add | map(select(.prerelease == true and .draft == false))[0].tag_name // empty')"

            if [[ -z "$PATCH_TAG" ]]; then
              echo "::error::No patches pre-release was found"
              exit 1
            fi

            gh release download "$PATCH_TAG" -R "$REPO_URL" --pattern "*.mpp"
            mapfile -t MPPS < <(find . -maxdepth 1 -type f -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle was downloaded"
              exit 1
            fi

            LATEST_MPP="${MPPS[${#MPPS[@]}-1]}"
            mv -- "$LATEST_MPP" patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"
          else
            PATCH_TAG="$(gh api "repos/$REPO_URL/releases/latest" | jq -r '.tag_name // empty')"

            if [[ -z "$PATCH_TAG" ]]; then
              echo "::error::No stable patches release was found"
              exit 1
            fi

            gh release download "$PATCH_TAG" -R "$REPO_URL" --pattern "*.mpp"
            mapfile -t MPPS < <(find . -maxdepth 1 -type f -name '*.mpp' -print | sort -V)
            if (( ${#MPPS[@]} == 0 )); then
              echo "::error::No .mpp patch bundle was downloaded"
              exit 1
            fi

            LATEST_MPP="${MPPS[${#MPPS[@]}-1]}"
            mv -- "$LATEST_MPP" patches.mpp
            echo "PATCHES_VERSION=$PATCH_TAG" >> "$GITHUB_ENV"
          fi

      - name: Decode Custom Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > custom.keystore
          chmod 0600 custom.keystore

      - name: Evaluate Pre-release Flag
        run: |
          if [[ "${{ inputs.cli_track }}" == "Pre-release" || "${{ inputs.patches_track }}" == "Pre-release" || "${{ inputs.patches_track }}" == "Custom Local" || "${{ inputs.version_selection }}" == "Beta" ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Prepare App Selection
        id: prep_apps
        env:
          APP_ADM: ${{ inputs.app_adm }}
          APP_ALPHA_PROGRESSION: ${{ inputs.app_alpha_progression }}
          APP_BANDLAB: ${{ inputs.app_bandlab }}
          APP_BATTERY_GURU: ${{ inputs.app_battery_guru }}
          APP_CRONOMETER: ${{ inputs.app_cronometer }}
          APP_DIRECTCHAT: ${{ inputs.app_directchat }}
          APP_FINCH: ${{ inputs.app_finch }}
          APP_FLIGHTRADAR24: ${{ inputs.app_flightradar24 }}
          APP_FOLDERSYNC: ${{ inputs.app_foldersync }}
          APP_INSHOT: ${{ inputs.app_inshot }}
          APP_LIQUID_GALLERY: ${{ inputs.app_liquid_gallery }}
          APP_POWERAMP: ${{ inputs.app_poweramp }}
          APP_SMART_AUDIOBOOK: ${{ inputs.app_smart_audiobook }}
          APP_SYMFONIUM: ${{ inputs.app_symfonium }}
          APP_TUMBLR: ${{ inputs.app_tumblr }}
          APP_VIDEO_CONVERTER: ${{ inputs.app_video_converter }}
          APP_WEBTOON: ${{ inputs.app_webtoon }}
        run: |
          set -euo pipefail

          APP_LIST=""
          if [[ "$APP_ADM" == "true" ]]; then APP_LIST="$APP_LIST,adm"; fi
          if [[ "$APP_ALPHA_PROGRESSION" == "true" ]]; then APP_LIST="$APP_LIST,alpha-progression"; fi
          if [[ "$APP_BANDLAB" == "true" ]]; then APP_LIST="$APP_LIST,bandlab"; fi
          if [[ "$APP_BATTERY_GURU" == "true" ]]; then APP_LIST="$APP_LIST,battery-guru"; fi
          if [[ "$APP_CRONOMETER" == "true" ]]; then APP_LIST="$APP_LIST,cronometer"; fi
          if [[ "$APP_DIRECTCHAT" == "true" ]]; then APP_LIST="$APP_LIST,directchat"; fi
          if [[ "$APP_FINCH" == "true" ]]; then APP_LIST="$APP_LIST,finch"; fi
          if [[ "$APP_FLIGHTRADAR24" == "true" ]]; then APP_LIST="$APP_LIST,flightradar24"; fi
          if [[ "$APP_FOLDERSYNC" == "true" ]]; then APP_LIST="$APP_LIST,foldersync"; fi
          if [[ "$APP_INSHOT" == "true" ]]; then APP_LIST="$APP_LIST,inshot"; fi
          if [[ "$APP_LIQUID_GALLERY" == "true" ]]; then APP_LIST="$APP_LIST,liquid-gallery"; fi
          if [[ "$APP_POWERAMP" == "true" ]]; then APP_LIST="$APP_LIST,poweramp"; fi
          if [[ "$APP_SMART_AUDIOBOOK" == "true" ]]; then APP_LIST="$APP_LIST,smart-audiobook"; fi
          if [[ "$APP_SYMFONIUM" == "true" ]]; then APP_LIST="$APP_LIST,symfonium"; fi
          if [[ "$APP_TUMBLR" == "true" ]]; then APP_LIST="$APP_LIST,tumblr"; fi
          if [[ "$APP_VIDEO_CONVERTER" == "true" ]]; then APP_LIST="$APP_LIST,video-converter"; fi
          if [[ "$APP_WEBTOON" == "true" ]]; then APP_LIST="$APP_LIST,webtoon"; fi

          APP_LIST="${APP_LIST#,}"

          if [[ -z "$APP_LIST" ]]; then
            echo "::error::No applications selected for patching!"
            exit 1
          fi

          echo "SELECTED_APPS=$APP_LIST" >> "$GITHUB_ENV"
          echo "Ready to patch: $APP_LIST"

      - name: Execute Chihafuyu Tool
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
          SELECTED_APPS: ${{ env.SELECTED_APPS }}
          ARCHITECTURE: ${{ inputs.architecture }}
          VERSION_SELECTION: ${{ inputs.version_selection }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          DOWNLOAD_SOURCE: ${{ inputs.download_source }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
        run: |
          set -euo pipefail

          python -u chihafuyu_tool.py \
            --ecosystem "arandomhooman" \
            --apps "$SELECTED_APPS" \
            --arch "$ARCHITECTURE" \
            --version-selection "$VERSION_SELECTION" \
            --custom-version "$CUSTOM_VERSION" \
            --download-source "$DOWNLOAD_SOURCE" \
            --continue-on-error "$CONTINUE_ON_ERROR" \
            --cli "morphe.jar" \
            --patches "patches.mpp" \
            --patches-version "$PATCHES_VERSION" \
            --repo-url "$TARGET_REPO_URL" \
            --keystore "custom.keystore" \
            --ks-alias "$KEYSTORE_ALIAS" \
            --ks-pass "$KEYSTORE_PASSWORD" \
            --signer "$KEYSTORE_SIGNER_NAME" \
            --is-prerelease "${{ env.IS_PRERELEASE }}"

      - name: Validate Release Outputs
        run: |
          set -euo pipefail

          test -s "./arandomhooman/changelog.md" || {
            echo "::error::Missing or empty changelog.md"
            exit 1
          }

          compgen -G "./arandomhooman/Output/*.apk" > /dev/null || {
            echo "::error::No APK output was produced"
            exit 1
          }

      - name: Set Release Tag
        run: echo "DATE_TAG=$(date -u +'%Y.%m.%d-%H%M%S')-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: arandomhooman-${{ env.DATE_TAG }}
          name: Patched Apps - arandomhooman (${{ env.DATE_TAG }})
          body_path: ./arandomhooman/changelog.md
          files: ./arandomhooman/Output/*.apk
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Send to Telegram Channel
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ECOSYSTEM: "arandomhooman"
        run: |
          set -euo pipefail

          python -m pip install pyrogram tgcrypto
          python tg_upload.py
