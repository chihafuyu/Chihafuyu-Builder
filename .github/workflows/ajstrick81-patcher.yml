name: 📺 Ajstrick81 Ecosystem Patcher

on:
  workflow_dispatch:
    inputs:
      app_disneyplus:
        description: 'Patch disneyplus'
        required: true
        type: boolean
        default: false
      app_prime_video:
        description: 'Patch prime-video'
        required: true
        type: boolean
        default: false
      app_netflix:
        description: 'Patch netflix'
        required: true
        type: boolean
        default: false
      app_hbo_max:
        description: 'Patch hbo-max'
        required: true
        type: boolean
        default: false
      app_peacock:
        description: 'Patch peacock'
        required: true
        type: boolean
        default: false
      app_tubi:
        description: 'Patch tubi'
        required: true
        type: boolean
        default: false
      app_vix:
        description: 'Patch vix'
        required: true
        type: boolean
        default: false
      app_pluto_tv:
        description: 'Patch pluto-tv'
        required: true
        type: boolean
        default: false
      app_paramount_plus:
        description: 'Patch paramount-plus'
        required: true
        type: boolean
        default: false
      app_twitch:
        description: 'Patch twitch'
        required: true
        type: boolean
        default: false
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'armeabi-v7a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options: [default, google_play, huggingface, archive, apkmirror, apkpure, apkcombo, aptoide, uptodown]
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release]
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: true

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_DISNEYPLUS: ${{ inputs.app_disneyplus }}
      APP_PRIME_VIDEO: ${{ inputs.app_prime_video }}
      APP_NETFLIX: ${{ inputs.app_netflix }}
      APP_HBO_MAX: ${{ inputs.app_hbo_max }}
      APP_PEACOCK: ${{ inputs.app_peacock }}
      APP_TUBI: ${{ inputs.app_tubi }}
      APP_VIX: ${{ inputs.app_vix }}
      APP_PLUTO_TV: ${{ inputs.app_pluto_tv }}
      APP_PARAMOUNT_PLUS: ${{ inputs.app_paramount_plus }}
      APP_TWITCH: ${{ inputs.app_twitch }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_DISNEYPLUS" == "true" ]]; then LIST="$LIST,disneyplus"; fi
          if [[ "$APP_PRIME_VIDEO" == "true" ]]; then LIST="$LIST,prime-video"; fi
          if [[ "$APP_NETFLIX" == "true" ]]; then LIST="$LIST,netflix"; fi
          if [[ "$APP_HBO_MAX" == "true" ]]; then LIST="$LIST,hbo-max"; fi
          if [[ "$APP_PEACOCK" == "true" ]]; then LIST="$LIST,peacock"; fi
          if [[ "$APP_TUBI" == "true" ]]; then LIST="$LIST,tubi"; fi
          if [[ "$APP_VIX" == "true" ]]; then LIST="$LIST,vix"; fi
          if [[ "$APP_PLUTO_TV" == "true" ]]; then LIST="$LIST,pluto-tv"; fi
          if [[ "$APP_PARAMOUNT_PLUS" == "true" ]]; then LIST="$LIST,paramount-plus"; fi
          if [[ "$APP_TWITCH" == "true" ]]; then LIST="$LIST,twitch"; fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then echo "::error::No applications selected!"; exit 1; fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets: inherit
    with:
      ecosystem: "ajstrick81"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "ajstrick81/morphe-androidtv-patches"
      custom_patch_filename: "ajstrick81-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "ajstrick81"
