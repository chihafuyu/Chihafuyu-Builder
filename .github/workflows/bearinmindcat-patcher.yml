---
name: 🐻 Bearinmindcat Ecosystem Patcher

"on":
  workflow_dispatch:
    inputs:
      app_alltrails:
        description: 'Patch alltrails'
        required: true
        type: boolean
        default: true
      app_google_maps:
        description: 'Patch google-maps'
        required: true
        type: boolean
        default: true
      app_waze:
        description: 'Patch waze'
        required: true
        type: boolean
        default: true
      app_samsung_keyboard:
        description: 'Patch samsung-keyboard'
        required: true
        type: boolean
        default: true
      app_samsung_gallery:
        description: 'Patch samsung-gallery'
        required: true
        type: boolean
        default: true
      architecture:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'arm64-v8a'
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
      version_selection:
        description: 'App Version Selection'
        required: true
        type: choice
        default: 'Latest Recommended'
        options: [Latest Recommended, Beta, Custom]
      custom_version:
        description: 'Custom App Version'
        required: false
        default: ''
      download_source:
        description: 'Download Source'
        required: true
        type: choice
        default: 'default'
        options:
          - default
          - google_play
          - huggingface
          - archive
          - apkmirror
          - apkpure
      continue_on_error:
        description: 'Debug: Continue on patch error'
        required: true
        type: boolean
        default: false
      cli_track:
        description: 'Morphe CLI Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom]
      custom_cli_version:
        description: 'Custom CLI Version (e.g. v1.16.0)'
        required: false
        default: ''
      patches_track:
        description: 'Ecosystem Patches Track'
        required: true
        type: choice
        default: 'Stable'
        options: [Stable, Pre-release, Custom Local]
      upload_github_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      send_to_telegram:
        description: 'Send to Telegram'
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  prepare-apps:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.build-list.outputs.apps }}
    env:
      APP_ALLTRAILS: ${{ inputs.app_alltrails }}
      APP_GOOGLE_MAPS: ${{ inputs.app_google_maps }}
      APP_WAZE: ${{ inputs.app_waze }}
      APP_SAMSUNG_KEYBOARD: ${{ inputs.app_samsung_keyboard }}
      APP_SAMSUNG_GALLERY: ${{ inputs.app_samsung_gallery }}
    steps:
      - id: build-list
        run: |
          set -euo pipefail
          LIST=""
          if [[ "$APP_ALLTRAILS" == "true" ]]; then
            LIST="$LIST,alltrails"
          fi
          if [[ "$APP_GOOGLE_MAPS" == "true" ]]; then
            LIST="$LIST,google-maps"
          fi
          if [[ "$APP_WAZE" == "true" ]]; then
            LIST="$LIST,waze"
          fi
          if [[ "$APP_SAMSUNG_KEYBOARD" == "true" ]]; then
            LIST="$LIST,samsung-keyboard"
          fi
          if [[ "$APP_SAMSUNG_GALLERY" == "true" ]]; then
            LIST="$LIST,samsung-gallery"
          fi
          LIST="${LIST#,}"
          if [[ -z "$LIST" ]]; then
            echo "::error::No applications selected!"
            exit 1
          fi
          {
            echo "apps<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  call-patcher:
    needs: prepare-apps
    permissions:
      contents: write
    uses: ./.github/workflows/core-engine.yml
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEYSTORE_SIGNER_NAME: ${{ secrets.KEYSTORE_SIGNER_NAME }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      HA_API_KEY: ${{ secrets.HA_API_KEY }}
      MD_API_KEY: ${{ secrets.MD_API_KEY }}
      PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
      PLAY_AAS_TOKEN: ${{ secrets.PLAY_AAS_TOKEN }}
      DEVICE_PROPERTIES_B64: ${{ secrets.DEVICE_PROPERTIES_B64 }}
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      SESSION_STRING: ${{ secrets.SESSION_STRING }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    with:
      ecosystem: "bearinmindcat"
      apps: ${{ needs.prepare-apps.outputs.selected }}
      architecture: ${{ inputs.architecture }}
      version_selection: ${{ inputs.version_selection }}
      custom_version: ${{ inputs.custom_version }}
      download_source: ${{ inputs.download_source }}
      continue_on_error: ${{ inputs.continue_on_error }}
      cli_track: ${{ inputs.cli_track }}
      custom_cli_version: ${{ inputs.custom_cli_version }}
      patches_track: ${{ inputs.patches_track }}
      repo_url: "bearinmindcat/morphe-patches"
      custom_patch_filename: "bearinmindcat-custom.mpp"
      upload_github_release: ${{ inputs.upload_github_release }}
      send_to_telegram: ${{ inputs.send_to_telegram }}
      release_tag_prefix: "bearinmindcat"
